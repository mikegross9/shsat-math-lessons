<script>

// ---------- drawing helpers (SVG in stage coordinates) ----------
const FONT = "PiFix, Avenir Next, Avenir, sans-serif";
const FILL = "rgba(142,202,230,0.25)", YFILL = "rgba(255,209,102,0.30)", TFILL = "rgba(6,214,160,0.25)", PFILL = "rgba(239,71,111,0.28)";
const pts = p => p.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" ");
const poly = (p, fill = FILL, stroke = "#fff", sw = 5, dash = "") =>
  `<polygon points="${pts(p)}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"${dash ? ` stroke-dasharray="${dash}"` : ""}/>`;
const ln = (x1, y1, x2, y2, c = "#fff", sw = 5, dash = "") =>
  `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${sw}" stroke-linecap="round"${dash ? ` stroke-dasharray="${dash}"` : ""}/>`;
const circ = (cx, cy, r, fill = "none", stroke = "#fff", sw = 5, dash = "") =>
  `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${dash ? ` stroke-dasharray="${dash}"` : ""}/>`;
const corner = (x, y, dx, dy, k = 22, c = "#fff") => `<path d="M${x + dx * k},${y} V${y + dy * k} H${x}" fill="none" stroke="${c}" stroke-width="4"/>`;
function bbox(p, pad = 12) {
  const xs = p.map(q => q[0]), ys = p.map(q => q[1]);
  return [Math.min(...xs) - pad, Math.min(...ys) - pad, Math.max(...xs) + pad, Math.max(...ys) + pad];
}
// An SVG item drawn in stage coordinates; box = [x0, y0, x1, y1]. The item's center is the box center
// (so rotate() turns it around that point).
function shp(s, inner, box, o = {}) {
  const [x0, y0, x1, y1] = box, w = x1 - x0, h = y1 - y0;
  return s.add(`<svg width="${w}" height="${h}" viewBox="${x0} ${y0} ${w} ${h}" style="display:block;overflow:visible" font-family="${FONT}">${inner}</svg>`,
    x0 + w / 2, y0 + h / 2, o);
}
const shape = (s, p, fill, stroke, sw, dash, o) => shp(s, poly(p, fill, stroke, sw, dash), bbox(p), o);
const seg = (s, x1, y1, x2, y2, c, sw = 6, dash = "") => shp(s, ln(x1, y1, x2, y2, c, sw, dash), bbox([[x1, y1], [x2, y2]], sw + 4));
// Isometric projection: x to the lower right, y to the lower left, z up.
const ISO = (ox, oy, k) => (x, y, z) => [ox + (x - y) * k * 0.866, oy + (x + y) * k * 0.5 - z * k];
function slab(P, L, D, z0, z1, fills = ["#4c7190", "#3a5979", "#294263"], grid = true) {
  const top = [P(0, 0, z1), P(L, 0, z1), P(L, D, z1), P(0, D, z1)];
  const left = [P(0, D, z0), P(L, D, z0), P(L, D, z1), P(0, D, z1)];
  const right = [P(L, 0, z0), P(L, D, z0), P(L, D, z1), P(L, 0, z1)];
  let g = "";
  const gl = (a, b) => { g += ln(a[0].toFixed(1), a[1].toFixed(1), b[0].toFixed(1), b[1].toFixed(1), "rgba(255,255,255,0.75)", 2.5); };
  if (grid) {
    for (let i = 1; i < L; i++) { gl(P(i, 0, z1), P(i, D, z1)); gl(P(i, D, z0), P(i, D, z1)); }
    for (let j = 1; j < D; j++) { gl(P(0, j, z1), P(L, j, z1)); gl(P(L, j, z0), P(L, j, z1)); }
    for (let k = z0 + 1; k < z1; k++) { gl(P(0, D, k), P(L, D, k)); gl(P(L, 0, k), P(L, D, k)); }
  }
  const svg = poly(top, fills[0], "#fff", 4) + poly(left, fills[1], "#fff", 4) + poly(right, fills[2], "#fff", 4) + g;
  return { svg, box: bbox([...top, ...left, ...right], 8) };
}
const T = (x, y, str, size = 44, color = "#fff", weight = 600, extra = "") =>
  `<text x="${x}" y="${y}" font-size="${size}" fill="${color}" text-anchor="middle" dominant-baseline="central" font-weight="${weight}" ${extra}>${str}</text>`;

// Practice Test 2 #19: rectangle MNPQ with a circle whose diameter is NP. Local coords; returns svg + key points.
function figM19(r, fs = 34, mg = 48) {
  const W = 2 * mg + 2 * r, Hh = 2 * mg + 2 * r;
  const M = [mg, mg], Q = [mg + 2 * r, mg], N = [mg, mg + r], Pp = [mg + 2 * r, mg + r], Y = [mg + r, mg + r], Z = [mg + r, mg];
  const it = (x, y, t) => T(x, y, t, fs, "#fff", 600, 'font-style="italic"');
  const svg = `<svg width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}" style="display:block" font-family="${FONT}">` +
    circ(Y[0], Y[1], r, "none", "#fff", 4) + poly([M, N, Pp, Q], "rgba(142,202,230,0.12)", "#fff", 4) +
    ln(Y[0], Y[1], Z[0], Z[1], "#fff", 3, "9 8") + `<circle cx="${Y[0]}" cy="${Y[1]}" r="6" fill="#fff"/>` +
    it(M[0] - fs * 0.6, M[1] - fs * 0.5, "M") + it(Q[0] + fs * 0.6, Q[1] - fs * 0.5, "Q") +
    it(N[0] - fs * 0.65, N[1] + fs * 0.2, "N") + it(Pp[0] + fs * 0.65, Pp[1] + fs * 0.2, "P") +
    it(Z[0] + fs * 0.55, Z[1] - fs * 0.5, "Z") + it(Y[0] + fs * 0.55, Y[1] + fs * 0.6, "Y") + `</svg>`;
  return { svg, W, H: Hh, M, N, P: Pp, Q, Y, Z };
}

function build() {

scene("S1Title", s => {
  const icons = [
    `<svg width="90" height="90"><rect x="8" y="8" width="74" height="74" fill="${FILL}" stroke="${C.y}" stroke-width="5"/></svg>`,
    `<svg width="100" height="90"><polygon points="6,84 94,84 30,8" fill="${YFILL}" stroke="${C.x}" stroke-width="5" stroke-linejoin="round"/></svg>`,
    `<svg width="90" height="90"><circle cx="45" cy="45" r="38" fill="${TFILL}" stroke="${C.op}" stroke-width="5"/></svg>`,
    `<svg width="80" height="96"><path d="M6,18 V78 A34,12 0 0 0 74,78 V18" fill="${FILL}" stroke="${C.y}" stroke-width="5"/><ellipse cx="40" cy="18" rx="34" ry="12" fill="${FILL}" stroke="${C.y}" stroke-width="5"/></svg>`,
  ].map((h, i) => s.add(h, CX + (i - 1.5) * 150, 210));
  const unit = s.text("UNIT 7", CX, 340, 44, { color: C.op, weight: 700, style: { letterSpacing: "0.3em" } });
  const title = s.text("Area, Circles &amp; Volume", CX, 450, 120, { weight: 700 });
  const sub = s.text("SHSAT Math with Victoria", CX, 560, 48, { color: C.dim });
  unit.fadeIn(s.c(0)); title.write(s.c(0) + 0.3, 1.3); sub.fadeIn(s.c(0) + 1.5);
  icons.forEach((it, i) => it.pop(s.c(0) + 1.8 + i * 0.25));
  const stat = s.text(`Practice tests: <b style="color:${C.neg}">7 of 10</b> area, circle &amp; volume questions missed`, CX, 740, 50, { color: C.dim });
  const stat2 = s.text(`One of them took <b style="color:${C.neg}">almost 6 minutes</b>.`, CX, 830, 46, { color: C.dim });
  stat.fadeIn(s.c(1)); stat2.fadeIn(s.c(1) + 3.5); stat.fadeOut(s.c(2)); stat2.fadeOut(s.c(2));
  s.text("Know the formulas, and why they work.", CX, 780, 58, { color: C.x, weight: 600 }).fadeIn(s.c(2) + 0.3);
});

scene("S2PerimArea", s => {
  const X0 = 250, Y0 = 330, U = 95, X1 = X0 + 6 * U, Y1 = Y0 + 4 * U;
  s.text("Perimeter vs. area", CX, 175, 64, { weight: 700 }).fadeIn(s.c(0));
  const sq = [];
  for (let r = 0; r < 4; r++) for (let c = 0; c < 6; c++)
    sq.push(s.add(`<div style="width:${U - 8}px;height:${U - 8}px;border-radius:6px;background:rgba(142,202,230,0.45)"></div>`, X0 + c * U + U / 2, Y0 + r * U + U / 2));
  const gridLines = shp(s, [1, 2, 3, 4, 5].map(c => ln(X0 + c * U, Y0, X0 + c * U, Y1, "rgba(255,255,255,0.35)", 2)).join("") +
    [1, 2, 3].map(r => ln(X0, Y0 + r * U, X1, Y0 + r * U, "rgba(255,255,255,0.35)", 2)).join(""), [X0, Y0, X1, Y1]);
  const rect = shape(s, [[X0, Y0], [X1, Y0], [X1, Y1], [X0, Y1]], "none", "#fff", 5);
  const l6 = s.text("6", (X0 + X1) / 2, Y1 + 50, 52), l4 = s.text("4", X0 - 45, (Y0 + Y1) / 2, 52);
  const t0 = s.c(0);
  rect.fadeIn(t0 + 0.3); gridLines.fadeIn(t0 + 0.6); l6.fadeIn(t0 + 0.9); l4.fadeIn(t0 + 0.9);

  // perimeter: the fence
  const PX = 1000;
  s.text(`<b style="color:${C.x}">Perimeter</b> <span style="color:${C.dim};font-size:40px">= distance around (a fence)</span>`, PX, 360, 54, { ax: 0 }).fadeIn(s.c(1));
  const sides = [[X0, Y0, X1, Y0, "6", (X0 + X1) / 2, Y0 - 40], [X1, Y0, X1, Y1, "4", X1 + 40, (Y0 + Y1) / 2],
    [X1, Y1, X0, Y1, "6", 0, 0], [X0, Y1, X0, Y0, "4", 0, 0]];
  const t2 = s.c(2);
  sides.forEach(([a, b, c, d, n, lx, ly], i) => {
    seg(s, a, b, c, d, C.x, 10).fadeIn(t2 + i * 0.65, 0.4, 0);
    if (lx) s.text(n, lx, ly, 52, { color: C.x }).fadeIn(t2 + i * 0.65, 0.4, 0);
  });
  [l6, l4].forEach((l, i) => l.tw(t2 + (2 + i) * 0.65, 0.3, { scale: 1.25 }).tw(t2 + (2 + i) * 0.65 + 0.3, 0.3, { scale: 1 }));
  const pe = s.text(`6 + 4 + 6 + 4 = <b style="color:${C.x}">20 units</b>`, PX, 450, 56, { ax: 0 });
  pe.write(t2 + 0.2, 2.4);

  // area: the carpet
  const t4 = s.c(4);
  s.text(`<b style="color:${C.y}">Area</b> <span style="color:${C.dim};font-size:40px">= squares inside (carpet)</span>`, PX, 600, 54, { ax: 0 }).fadeIn(t4);
  sq.forEach((q, i) => q.pop(t4 + 0.5 + i * 0.07, 0.35));
  const t5 = s.c(5);
  const row = s.ring({ cx: (X0 + X1) / 2, cy: Y0 + U / 2, w: X1 - X0, h: U }, C.x, 6); row.pop(t5); row.fadeOut(t5 + 1.6);
  const col = s.ring({ cx: X0 + U / 2, cy: (Y0 + Y1) / 2, w: U, h: Y1 - Y0 }, C.x, 6); col.pop(t5 + 1.6); col.fadeOut(t5 + 3.0);
  const ar = s.text(`6 per row × 4 rows`, PX, 690, 56, { ax: 0 }); ar.fadeIn(t5);
  s.text(`= <b style="color:${C.y}">24 square units</b>`, PX + 30, 770, 56, { ax: 0 }).fadeIn(s.c(6));
  const f = s.text(`Area = length × width &nbsp;<span style="color:${C.dim};font-size:44px">(units²)</span>`, CX, 905, 64, { weight: 700 });
  f.pop(s.c(7));
});

scene("S3Formulas", s => {
  s.text("Where the formulas come from", CX, 175, 64, { weight: 700 }).fadeIn(s.c(0));
  const F = 1.15, TOP = 420;
  const at = (px, cxl) => (p) => [px + (p[0] - cxl) * F, TOP + p[1] * F];
  const hl = (pt, p1, p2) => seg(s, ...pt(p1), ...pt(p2), C.x, 5, "12 10");
  const lab = (pt, p, str, color = "#fff", size = 46) => { const q = pt(p); return s.text(str, q[0], q[1], size, { color, weight: 600 }); };
  const name = (x, str) => s.text(str, x, 335, 48, { color: C.dim, weight: 600 });
  const formula = (x, html) => s.text(html, x, 770, 56, { weight: 700 });
  const note = (x, str) => s.text(str, x, 840, 36, { color: C.dim });

  // 1. parallelogram -> rectangle
  const p1 = at(330, 190);
  const pA = shape(s, [[0, 180], [80, 180], [80, 0]].map(p1), YFILL, "#fff", 5);
  const pB = shape(s, [[80, 0], [380, 0], [300, 180], [80, 180]].map(p1), FILL, "#fff", 5);
  const h1 = hl(p1, [80, 0], [80, 180]);
  const b1 = lab(p1, [190, 222], "b"), hh1 = lab(p1, [105, 90], "h", C.x);
  const t1 = s.c(1);
  pA.fadeIn(t1); pB.fadeIn(t1); b1.fadeIn(t1 + 0.4); h1.fadeIn(t1 + 0.8); hh1.fadeIn(t1 + 0.8);
  const scissors = lab(p1, [80, -32], "✂", C.neg, 44); scissors.pop(t1 + 1.3); scissors.fadeOut(t1 + 2.6);
  pA.shift(t1 + 2.0, 1.4, 300 * F, 0); b1.shift(t1 + 2.0, 1.4, 40 * F, 0);
  formula(330, "A = b × h").pop(s.c(2));
  note(330, "a rectangle in disguise").fadeIn(s.c(2) + 0.5);

  // 2. triangle + rotated copy -> parallelogram
  const p2 = at(960, 190), tri = [[0, 180], [300, 180], [80, 0]];
  const piv2 = p2([190, 90]);
  const t3 = s.c(3);
  shape(s, tri.map(p2), FILL, "#fff", 5).fadeIn(t3);
  const h2 = hl(p2, [80, 0], [80, 180]); h2.fadeIn(t3 + 0.4);
  lab(p2, [150, 222], "b").fadeIn(t3 + 0.4); lab(p2, [105, 110], "h", C.x).fadeIn(t3 + 0.4);
  const R2 = 260;
  const copy2 = shp(s, poly(tri.map(p2), YFILL, "#fff", 4, "14 10"), [piv2[0] - R2, piv2[1] - R2, piv2[0] + R2, piv2[1] + R2]);
  copy2.show(t3 + 1.3); copy2.rotate(t3 + 1.6, 1.6, 180);
  formula(960, "A = ½ × b × h").pop(s.c(4));
  note(960, "half a parallelogram").fadeIn(s.c(4) + 0.5);

  // 3. trapezoid + rotated copy -> parallelogram with base b1 + b2
  const p3 = at(1560, 230), trap = [[0, 180], [260, 180], [200, 0], [60, 0]];
  const piv3 = p3([230, 90]);
  const t5 = s.c(5);
  shape(s, trap.map(p3), FILL, "#fff", 5).fadeIn(t5);
  const h3 = hl(p3, [60, 0], [60, 180]); h3.fadeIn(t5 + 0.4);
  lab(p3, [130, 0 - 34], "b₁").fadeIn(t5 + 0.4); lab(p3, [130, 222], "b₂").fadeIn(t5 + 0.4); lab(p3, [85, 110], "h", C.x).fadeIn(t5 + 0.4);
  const R3 = 300;
  const copy3 = shp(s, poly(trap.map(p3), YFILL, "#fff", 4, "14 10"), [piv3[0] - R3, piv3[1] - R3, piv3[0] + R3, piv3[1] + R3]);
  copy3.show(t5 + 1.3); copy3.rotate(t5 + 1.6, 1.6, 180);
  lab(p3, [330, 222], "b₁", C.x).fadeIn(t5 + 3.3);
  formula(1560, "A = ½(b₁ + b₂) × h").pop(s.c(6));
  note(1560, "half a parallelogram").fadeIn(s.c(6) + 0.5);

  name(330, "Parallelogram").fadeIn(t1); name(960, "Triangle").fadeIn(t3); name(1560, "Trapezoid").fadeIn(t5);
  const t7 = s.c(7);
  [h1, h2, h3].forEach(h => h.pulse(t7 + 0.4, 1.12));
  s.text("The height is straight up and down, never the slanted side.", CX, 945, 48, { color: C.neg, weight: 600 }).fadeIn(t7);
});

scene("S4Composite", s => {
  const U = 75, X0 = 260, Y0 = 330;
  const X = a => X0 + a * U, Y = b => Y0 + b * U;   // b measured down from the top
  s.text("Odd shapes = simple shapes", CX, 175, 64, { weight: 700 }).fadeIn(s.c(0));
  const L = [[X(0), Y(0)], [X(4), Y(0)], [X(4), Y(3)], [X(8), Y(3)], [X(8), Y(6)], [X(0), Y(6)]];
  const outline = shape(s, L, "rgba(142,202,230,0.10)", "#fff", 6);
  const labs = [["8", X(4), Y(6) + 45], ["6", X(0) - 40, Y(3)], ["4", X(2), Y(0) - 40], ["3", X(4) + 35, Y(1.5)], ["4", X(6), Y(3) - 40], ["3", X(8) + 35, Y(4.5)]]
    .map(([t, x, y]) => s.text(t, x, y, 50));
  const t0 = s.c(0);
  outline.fadeIn(t0 + 0.3); labs.forEach((l, i) => l.fadeIn(t0 + 0.8 + i * 0.15));

  // way 1: split into two rectangles
  const t1 = s.c(1);
  const bot = shape(s, [[X(0), Y(3)], [X(8), Y(3)], [X(8), Y(6)], [X(0), Y(6)]], FILL, "none", 0);
  const topL = shape(s, [[X(0), Y(0)], [X(4), Y(0)], [X(4), Y(3)], [X(0), Y(3)]], YFILL, "none", 0);
  const cut = seg(s, X(0), Y(3), X(4), Y(3), C.x, 5, "14 10");
  cut.fadeIn(t1); bot.fadeIn(t1 + 0.6); topL.fadeIn(t1 + 0.9);
  const PX = 1010;
  s.text("Add the pieces", PX, 330, 50, { ax: 0, color: C.op, weight: 700 }).fadeIn(t1);
  const t2 = s.c(2);
  const n24 = s.text("24", X(4), Y(4.5), 64, { weight: 700 }), n12 = s.text("12", X(2), Y(1.5), 64, { weight: 700 });
  s.text(`8 × 3 = <span style="color:${C.y}">24</span>`, PX, 410, 54, { ax: 0 }).fadeIn(t2); n24.pop(t2);
  s.text(`4 × 3 = <span style="color:${C.x}">12</span>`, PX, 480, 54, { ax: 0 }).fadeIn(t2 + 1.5); n12.pop(t2 + 1.5);
  s.text(`24 + 12 = <b>36</b>`, PX, 555, 54, { ax: 0 }).fadeIn(s.c(3));

  // way 2: complete the rectangle, subtract the corner
  const t4 = s.c(4);
  [bot, topL, cut, n24, n12].forEach(it => it.fadeOut(t4, 0.5));
  const big = shape(s, [[X(0), Y(0)], [X(8), Y(0)], [X(8), Y(6)], [X(0), Y(6)]], FILL, "none", 0);
  const miss = shape(s, [[X(4), Y(0)], [X(8), Y(0)], [X(8), Y(3)], [X(4), Y(3)]], "none", C.neg, 5, "14 10");
  miss.fadeIn(t4 + 0.3); big.fadeIn(t4 + 0.6);
  s.text("Or subtract what's missing", PX, 660, 50, { ax: 0, color: C.op, weight: 700 }).fadeIn(t4);
  s.text(`8 × 6 = 48`, PX, 740, 54, { ax: 0 }).fadeIn(t4 + 1.0);
  const t5 = s.c(5);
  const missF = shape(s, [[X(4), Y(0)], [X(8), Y(0)], [X(8), Y(3)], [X(4), Y(3)]], PFILL, "none", 0);
  missF.fadeIn(t5); s.text("− 12", X(6), Y(1.2), 56, { color: C.neg, weight: 700 }).pop(t5 + 0.3);
  s.text(`4 × 3 = <span style="color:${C.neg}">12</span>`, PX, 810, 54, { ax: 0 }).fadeIn(t5);

scene("S6Pythag", s => {

    for (let i = 1; i < cnt; i++) {

  s.text("Scale drawings and maps: convert the lengths first, then multiply.", CX, 950, 46, { color: C.x, weight: 600 }).fadeIn(s.c(5));
});

function m19card(s, x, y, show = false) {
  const f = figM19(135, 32, 46);
  const html = `<div class="card" style="display:flex;align-items:center;gap:50px;padding:34px 56px;text-align:left">${f.svg}` +
    `<div style="width:900px;white-space:normal"><div style="font-size:32px;color:${C.dim};margin-bottom:16px">Practice Test 2 · Question 19</div>` +
    `<div style="font-size:38px;line-height:1.35"><i>Y</i> is the center of the circle. <i>NP</i> is a diameter. The perimeter of rectangle <i>MNPQ</i> is 36 centimeters. ` +
    `<i>YZ</i> is a radius and <i>Z</i> is on <i>MQ</i>. What is the area of the circle?</div>` +
    `<div style="font-size:40px;margin-top:20px;display:flex;gap:56px"><span>A. 6π</span><span>B. 9π</span><span>C. 24π</span><span>D. 36π</span></div></div></div>`;
  return s.add(html, x, y, { show });
}

scene("S10Question", s => {
  s.text("Your real question", CX, 175, 56, { color: C.x, weight: 700 }).fadeIn(s.c(0));
  m19card(s, CX, 480).fadeIn(s.c(0) + 0.3);
  s.text(`<span style="color:${C.dim}">Your answer:</span> <b style="color:${C.neg}">6π ✗</b> <span style="display:inline-block;width:90px"></span><span style="color:${C.dim}">Time:</span> <b style="color:${C.neg}">5 min 52 sec</b>`, CX, 800, 54).fadeIn(s.c(1));
  s.text(`<span style="color:${C.dim}">Goal:</span> <b style="color:${C.op}">under 2 minutes</b>`, CX, 905, 58).pop(s.c(2));
});

scene("S11Solve", s => {
  s.text(`Rectangle <i>MNPQ</i>: perimeter 36 cm. &nbsp;Find the area of the circle.`, CX, 175, 42, { color: C.dim }).fadeIn(s.c(0));
  const f = figM19(190, 44, 52), YX = 450, YY = 560;
  const ox = YX - f.Y[0], oy = YY - f.Y[1];
  s.add(f.svg, ox + f.W / 2, oy + f.H / 2).fadeIn(s.c(0));
  const g = p => [ox + p[0], oy + p[1]];
  const [M, N, P, Q, Y, Z] = [f.M, f.N, f.P, f.Q, f.Y, f.Z].map(g);
  const BX = 790;
  s.badge(1, "Write every side in r", BX, 300).fadeIn(s.c(0) + 0.4);
  const t1 = s.c(1);
  seg(s, ...Y, ...Z, C.x, 7).fadeIn(t1, 0.5, 0);
  s.text("r", Y[0] + 26, (Y[1] + Z[1]) / 2, 50, { color: C.x, style: { fontStyle: "italic" } }).fadeIn(t1 + 0.3);
  seg(s, ...M, ...N, C.x, 9).fadeIn(t1 + 2.2, 0.5, 0); seg(s, ...Q, ...P, C.x, 9).fadeIn(t1 + 2.2, 0.5, 0);
  s.text("r", M[0] - 34, (M[1] + N[1]) / 2, 50, { color: C.x, style: { fontStyle: "italic" } }).fadeIn(t1 + 2.4);
  s.text("r", Q[0] + 34, (Q[1] + P[1]) / 2, 50, { color: C.x, style: { fontStyle: "italic" } }).fadeIn(t1 + 2.4);
  const t2 = s.c(2);
  seg(s, ...N, ...P, C.y, 9).fadeIn(t2, 0.5, 0); seg(s, ...M, ...Q, C.y, 9).fadeIn(t2 + 0.4, 0.5, 0);
  s.text("2r", (N[0] + Y[0]) / 2, N[1] + 44, 48, { color: C.y, style: { fontStyle: "italic" } }).fadeIn(t2 + 0.3);
  s.text("2r", (M[0] + Z[0]) / 2, M[1] - 36, 48, { color: C.y, style: { fontStyle: "italic" } }).fadeIn(t2 + 0.6);
  const EX = 1340;
  const t3 = s.c(3);
  s.badge(2, "Use the perimeter", BX, 420).fadeIn(t3);
  s.eq("r + 2r + r + 2r = 36", EX, 520, 62).write(t3 + 0.8, 2.2);
  const t4 = s.c(4);
  s.eq("6r = 36", EX, 615, 62).fadeIn(t4);
  const e3 = s.eq("r = 6", EX, 710, 62); e3.fadeIn(t4 + 1.4);
  const L3 = e3.L(), R3 = e3.R();
  s.ring({ cx: (L3.l + R3.r) / 2, cy: L3.cy, w: R3.r - L3.l, h: L3.h }, C.x, 16).pop(t4 + 2.0);
  s.badge(3, "Area = πr²", BX, 810).fadeIn(s.c(5));
  const e4 = s.eq("A = π × 6² = 36π", EX, 905, 62); e4.fadeIn(s.c(6));
  s.text("✓", e4.R().r + 50, 905, 62, { color: C.op, weight: 700 }).pop(s.c(6) + 1.4);
});

scene("S12Check", s => {
  s.text("Check it", CX, 175, 64, { weight: 700 }).fadeIn(s.c(0));
  s.text(`Your answer: <b style="color:${C.neg}">6π</b> = π × 6 &nbsp;<span style="color:${C.neg}">✗ the radius never got squared</span>`, CX, 300, 54).fadeIn(s.c(0) + 0.3);
  const t1 = s.c(1);
  const f = figM19(150, 38, 50);
  const fig = s.add(f.svg, 450, 640); fig.fadeIn(t1);
  const ox = 450 - f.W / 2, oy = 640 - f.H / 2;
  s.text("6", ox + f.M[0] - 60, oy + (f.M[1] + f.N[1]) / 2, 46, { color: C.x }).fadeIn(t1 + 0.5);
  s.text("12", ox + f.Y[0] - 60, oy + f.M[1] - 32, 46, { color: C.y }).fadeIn(t1 + 0.5);
  s.text(`r = 6: &nbsp;6 + 12 + 6 + 12 = 36 <b style="color:${C.op}">✓</b>`, 860, 520, 56, { ax: 0 }).fadeIn(t1 + 1.0);
  const t2 = s.c(2);
  s.text(`A = π × 6² = π × 36 = <b style="color:${C.op}">36π</b>`, 860, 640, 56, { ax: 0 }).fadeIn(t2);
  s.text(`Answer: <b style="color:${C.op}">D</b>`, 860, 730, 56, { ax: 0 }).pop(t2 + 1.5);
  s.text("Past 2½ minutes? Make your best guess and move on.", CX, 930, 50, { color: C.neg, weight: 600 }).fadeIn(s.c(3));
});

scene("S13Recap", s => {
  s.text("Your toolkit", CX, 175, 72, { weight: 700 }).fadeIn(s.c(0));

    "Perimeter goes around. Area fills the inside.",

    "Circles: write r = ___ first. Leave π in the answer.",
    "Right triangles: a² + b² = c².",
    "Volume = base area × height. Pyramid or cone: ⅓ of that.",
    "Lengths × k: area × k², volume × k³.",
  ];
  lines.forEach((l, i) => s.badge(i + 1, `<span style="color:#fff;font-weight:500">${esc(l)}</span>`, 300, 285 + i * 105, { size: 44 })
    .fadeIn(s.c(i + 1), 0.6, 0).set(s.c(i + 1), { sx: -30 }).tw(s.c(i + 1), 0.6, { sx: 0 }));
  s.text("Next: Workbook Unit 7 practice.  You've got this!", CX, 935, 54, { color: C.op, weight: 700 }).pop(s.c(7));
});
