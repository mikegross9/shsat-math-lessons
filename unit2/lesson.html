<link rel="stylesheet" href="../lesson.css">
<style>
  /* Unit 2 only. Word problems are long: put the four choices in one row under a long question. */
  .qtext.long ~ .answer .choices { grid-template-columns: repeat(4, auto); gap: 22px; }
  .qtext.long ~ .answer .choice { width: 330px; height: 100px; font-size: 48px; padding: 0 26px; }
  .withfig .choices { grid-template-columns: 1fr 1fr !important; }
  .qtext.long:has(+ .answer.withfig) { font-size: 38px; line-height: 1.25; }
  .qfig svg { max-height: 330px; width: auto; }
  /* Choices: keep "3x − 7" together (the shared flex layout puts a gap around the colored x). */
  .choice { display: block; text-align: left; line-height: 112px; }
  .choice .letter { display: inline-flex; vertical-align: middle; margin-right: 30px; line-height: 64px; position: relative; top: -4px; }
  .qtext.long ~ .answer .choice { line-height: 92px; }
  .qtext.long ~ .answer .choice .letter { margin-right: 22px; }
  .withfig .choice { line-height: 96px; }
  /* The score table: 13 questions, one line each. */
  #summary { gap: 18px; padding-top: 112px; }
  .sumtitle { font-size: 64px; }
  .sumtable { table-layout: fixed; width: 1620px; font-size: 24px; }
  .sumtable th:nth-child(1) { width: 1010px; } .sumtable th:nth-child(2) { width: 150px; }
  .sumtable td, .sumtable th { padding: 3px 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wcard { text-align: left; white-space: normal; line-height: 1.32; }

// A plain box with text in it (bar models, chains).
const tile = (html, w, h, color, o = {}) =>
  `<div class="box" style="width:${w}px;height:${h}px;border-color:${color};color:${o.fg || color};background:${o.bg || "transparent"};font-size:${o.size || 52}px;font-weight:600">${html}</div>`;
const arrowR = (w = 80, color = "#fff") =>
  `<svg width="${w}" height="40"><path d="M6 20 H${w - 12} M${w - 26} 6 L${w - 10} 20 L${w - 26} 34" stroke="${color}" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const boxOf = (a, b) => ({ l: Math.min(a.l, b.l), r: Math.max(a.r, b.r), t: Math.min(a.t, b.t), b: Math.max(a.b, b.b),
  cx: (Math.min(a.l, b.l) + Math.max(a.r, b.r)) / 2, cy: (Math.min(a.t, b.t) + Math.max(a.b, b.b)) / 2,
  w: Math.max(a.r, b.r) - Math.min(a.l, b.l), h: Math.max(a.b, b.b) - Math.min(a.t, b.t) });

function build() {

  const arr = [760, 1160].map(x => s.add(arrowR(70), x, 740));
  [tiles[0], arr[0], tiles[1], arr[1], tiles[2]].forEach((it, i) => it.fadeIn(t2 + i * 0.45, 0.5, 0));

scene("S3Total", s => {

  const t8 = s.c(8);
  s.ring(exprs[2].rect(), C.neg, 14).pop(t8);

scene("S4Consecutive", s => {
  s.text("Consecutive integers", CX, 170, 66, { weight: 700 }).fadeIn(s.c(0));
  const LY = 420, X = n => 300 + (n - 13) * 220;
  const line = s.add(`<svg width="1560" height="40"><path d="M10 20 H1550 M28 4 L8 20 L28 36 M1532 4 L1552 20 L1532 36" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`, CX, LY);
  const ticks = [], nums = [];
  for (let n = 13; n <= 19; n++) {
    ticks.push(s.add(`<div style="width:5px;height:34px;background:#fff;border-radius:3px"></div>`, X(n), LY));
    nums.push(s.text(String(n), X(n), LY + 60, 48, { color: n >= 15 && n <= 17 ? "#fff" : C.dim }));
  }
  const dots = [15, 16, 17].map(n => s.add(`<div style="width:34px;height:34px;border-radius:50%;background:${C.x}"></div>`, X(n), LY));
  const t0 = s.c(0);
  line.fadeIn(t0 + 0.3, 0.5, 0); ticks.forEach((t, i) => t.fadeIn(t0 + 0.4 + i * 0.05, 0.3, 0)); nums.forEach((t, i) => t.fadeIn(t0 + 0.5 + i * 0.05, 0.3, 0));
  dots.forEach((d, i) => d.pop(t0 + 1.4 + i * 0.4));
  const arc = (a, t) => {
    const g = s.add(`<svg width="220" height="70"><path d="M14 8 Q110 78 206 8 M188 6 L207 8 L200 26" stroke="${C.op}" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`, (X(a) + X(a + 1)) / 2, LY + 125);
    const p = s.text("+1", (X(a) + X(a + 1)) / 2, LY + 185, 40, { color: C.op, weight: 700 });
    g.fadeIn(t, 0.5, 0); p.fadeIn(t + 0.2, 0.5, 0);
  };
  const labs = ["x", "x + 1", "x + 2"].map((l, i) => s.text(m(l), X(15 + i), LY - 85, 60, { weight: 600 }));
  labs[0].pop(s.c(1));
  arc(15, s.c(1) + 0.8); labs[1].pop(s.c(2));
  arc(16, s.c(2) + 0.6); labs[2].pop(s.c(3));
  const t4 = s.c(4);
  s.text(`<span style="color:${C.dim}">odd or even:</span>&nbsp;&nbsp; ${["x", "x + 2", "x + 4"].map(m).join(",&nbsp;&nbsp; ")}`, CX, 700, 58, { weight: 500 }).fadeIn(t4);
  s.text("like 15, 17, 19  or  16, 18, 20", CX, 770, 40, { color: C.dim }).fadeIn(t4 + 1.5);
  s.eq("x + (x + 1) + (x + 2) = 3x + 3", CX, 865, 64).fadeIn(s.c(5));
  s.text(`${m("x")} is the <b>smallest</b>. Answer what they asked!`, CX, 958, 50, { color: C.neg, weight: 600 }).fadeIn(s.c(6));
});

  s.text(`<span style="color:${C.op}">200</span> + <span style="color:${C.x}">15</span><span style="color:${C.y};font-style:italic">m</span>`, 1120, 570, 62, { ax: 0, weight: 600 }).fadeIn(s.c(4) + 1.4);
  s.text("ball drops 1.2 feet per second", 1000, 680, 46, { ax: 1, color: "#dfe6f0" }).fadeIn(s.c(5) + 1.2);
  s.text("→", 1060, 680, 48, { color: C.dim }).fadeIn(s.c(6));
  s.text(`<span style="color:${C.op}">90</span> <span style="color:${C.neg}">−</span> <span style="color:${C.x}">1.2</span><span style="color:${C.y};font-style:italic">t</span>`, 1120, 680, 62, { ax: 0, weight: 600 }).fadeIn(s.c(6) + 0.2);

  eqx.fadeIn(s.c(8));
  s.ring(eqx.rect(), C.op, 16).pop(s.c(8) + 1.2);
});

function card17(s, x, y, scale = 1, show = false) {
  const html = `<div class="card wcard" style="width:1480px;box-sizing:border-box;padding:34px 60px">` +
    `<div style="font-size:36px;color:${C.dim};margin-bottom:16px">Practice Test 2 · Question 17</div>` +
    `<div style="font-size:50px">Tamara’s salary is $26,000. Mark’s salary is $23,200. At the end of each year, Tamara is given a $500 raise and Mark is given a $900 raise. ` +
    `After how many years will Mark and Tamara be earning <span class="same">the same amount</span>?</div></div>`;
  const it = s.add(html, x, y, { show });
  it.base.scale = scale;
  it.apply(it.base);
  return it;
}

scene("S8Solve", s => {
  s.badge(4, "Solve", 90, 200).fadeIn(s.c(0));
  const e0 = s.eq("26,000 + 500x = 23,200 + 900x", CX, 200, 72); e0.fadeIn(s.c(0) + 0.4);
  s.ops(e0, "− 500x", "− 500x", 300).forEach(it => it.fadeIn(s.c(1)));
  const e1 = s.eq("26,000 = 23,200 + 400x", CX, 400, 72); e1.fadeIn(s.c(2));
  s.ops(e1, "− 23,200", "− 23,200", 500).forEach(it => it.fadeIn(s.c(3)));
  const e2 = s.eq("2,800 = 400x", CX, 600, 72); e2.fadeIn(s.c(4));
  s.ops(e2, "÷ 400", "÷ 400", 700).forEach(it => it.fadeIn(s.c(5)));
  const e3 = s.eq("7 = x", CX, 800, 72); e3.fadeIn(s.c(6));
  const L = e3.L(), R = e3.R();
  s.ring({ cx: (L.l + R.r) / 2, cy: L.cy, w: R.r - L.l, h: L.h }, C.x, 22).pop(s.c(6) + 0.6);
  s.text("They earn the same after 7 years.", CX, 930, 54, { color: C.op, weight: 700 }).fadeIn(s.c(6) + 1.4);
});

});

  s.text(`How old is Mia now?`, 520, 255, 46, { color: "#dfe6f0" }).fadeIn(t1 + 0.9);

  ch.forEach((c, i) => c.fadeIn(t1 + 1.3 + i * 0.2, 0.4, 0));

  const cols = [330, 650, 990, 1330, 1660];
  const heads = ["Mia now", "Aunt now", "Mia + 6", "Aunt + 6", "Half?"].map((h, i) => s.text(h, cols[i], 400, 40, { color: C.dim }));
