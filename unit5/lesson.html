<script>

const RED = C.neg, YEL = C.x, BLU = "#5aa9e6";
const fr = (a, b, color) => `<span class="fr"${color ? ` style="color:${color}"` : ""}><span>${a}</span><span>${b}</span></span>`;
const col = (c, t) => `<span style="color:${c}">${t}</span>`;
const marble = (c, d = 76) => `<div style="width:${d}px;height:${d}px;border-radius:50%;background:radial-gradient(circle at 34% 30%, rgba(255,255,255,.8) 0, rgba(255,255,255,0) 30%), ${c};box-shadow:inset -7px -9px 0 rgba(0,0,0,.22)"></div>`;
const bagHtml = (w, h) => `<div style="width:${w}px;height:${h}px;border:5px solid ${C.dim};border-top:none;border-radius:0 0 70px 70px;background:rgba(255,255,255,0.035)"></div>`;
// A math row (text with inline fractions), anchored left unless o.ax says otherwise.
const row = (s, html, x, y, size, o = {}) => s.text(`<div class="mrow">${html}</div>`, x, y, size, { ax: 0, ...o });

// ---- Manim-style helpers for this unit ----
// Move an Item's base position (build time, before any tween).
const place = (it, x, y) => { it.base.x = x; if (y !== undefined) it.base.y = y; it.apply(it.base); return it; };
const partsOf = e => e.all || [e];
// A stacked fraction whose numerator N, bar B and denominator D are separate Items, so counts can fly into it,
// tick down in place, or be cancelled. (x, y) is the centre of the bar.
function fp(s, num, den, x, y, size = 64, o = {}) {
  const g = size * 0.62, wt = o.weight || 500;
  const N = s.text(String(num), x, y - g, size, { color: o.nc || o.color || "#fff", weight: wt });
  const D = s.text(String(den), x, y + g, size, { color: o.dc || o.color || "#fff", weight: wt });
  const w = Math.max(N.rect().w, D.rect().w, size * 0.55) + size * 0.3;
  const B = s.add(`<div style="width:${w}px;height:${Math.max(4, Math.round(size * 0.075))}px;border-radius:3px;background:${o.bc || o.color || "#fff"}"></div>`, x, y);
  const f = { N, B, D, all: [N, B, D], w, size, y,
    at(nx) { f.all.forEach(p => place(p, nx)); return f; },
    fadeIn(t, d = 0.6, dy = 0) { f.all.forEach(p => p.fadeIn(t, d, dy)); return f; },
    fadeOut(t, d = 0.4) { f.all.forEach(p => p.fadeOut(t, d)); return f; },
    show(t) { f.all.forEach(p => p.show(t)); return f; },
    pop(t) { f.all.forEach(p => p.pop(t)); return f; },
    box() { const a = N.rect(), b = D.rect(), c = B.rect(); return { l: Math.min(a.l, c.l), r: Math.max(a.r, c.r), t: a.t, b: b.b, cx: c.cx, cy: c.cy, w: c.w, h: b.b - a.t }; } };
  return f;
}
// A line of math laid out left to right: strings become text Items, [num, den, opts] become fp fractions.
// Anchored at x by o.ax (0 = left edge, 0.5 = centre). Returns the pieces in order.
function seq(s, x, y, size, specs, o = {}) {
  const gap = size * (o.gap ?? 0.26);
  const els = specs.map(sp => Array.isArray(sp) ? fp(s, sp[0], sp[1], 0, y, sp[3] || size, sp[2] || {})
    : s.text(sp, 0, y, size, { color: o.color, weight: o.weight }));
  const ws = els.map(e => e.N ? e.w : e.rect().w);
  const total = ws.reduce((a, b) => a + b, 0) + gap * (els.length - 1);
  let cx = x - total * (o.ax ?? 0);
  els.forEach((e, i) => { const c = cx + ws[i] / 2; e.N ? e.at(c) : place(e, c); cx += ws[i] + gap; });
  els.fadeIn = (t, d = 0.6, dy = 0) => { els.forEach(e => e.fadeIn(t, d, dy)); return els; };
  els.right = () => cx - gap;
  return els;
}
const boxOf = e => e.N ? e.box() : e.rect();
// A ghost copy of `html` flies from box `from` (drawn at font size fs) onto the Item `to` (font size ts), which then appears.
function fly(s, html, from, fs, to, ts, t, d = 0.9, o = {}) {
  const r = to.rect ? to.rect() : to;
  const g = s.text(html, from.cx, from.cy, fs, { color: o.color || "#fff", weight: o.weight || 500 });
  g.show(t); g.tw(t, d, { x: r.cx, y: r.cy, scale: ts / fs }, "inout"); g.tw(t + d - 0.05, 0.15, { opacity: 0 }, "linear");
  if (!o.keep && to.tw) to.tw(t + d - 0.1, 0.2, { opacity: 1 }, "linear");
  return g;
}
// A number changes in place: the old one rolls up and out, the new one rolls up into its place.
function tick(oldIt, newIt, t, d = 0.5) {
  const h = oldIt.rect().h * 0.6;
  oldIt.tw(t, d, { opacity: 0, oy: -h });
  newIt.set(t, { oy: h }); newIt.tw(t, d, { opacity: 1, oy: 0 });
}
// Copy a whole fraction (or any pieces) to a new spot: ghosts of each part slide onto the matching new part.
function copyTo(s, fromParts, toParts, t, d = 0.9) {
  fromParts.forEach((f, i) => {
    const to = toParts[i], r = f.rect(), tr = to.rect(), st = f.state(t);
    const g = s.add(f.el.innerHTML, r.cx, r.cy + st.oy, { style: { cssText: f.el.style.cssText } });
    g.el.style.cssText = f.el.style.cssText;
    g.ax = 0.5; g.ay = 0.5; g.el.style.transformOrigin = "50% 50%";
    g.show(t); g.tw(t, d, { x: tr.cx, y: tr.cy }, "inout"); g.tw(t + d - 0.05, 0.15, { opacity: 0 }, "linear");
    to.tw(t + d - 0.1, 0.2, { opacity: 1 }, "linear");
  });
}
// Separate Items laid exactly over pieces of a (hidden) text Item, e.g. the "3", "+", "4" of "3 + 4".
function pieces(s, it, subs, size, o = {}) {
  let from = 0;
  return subs.map(([sub, html]) => {
    const b = s.partBox(it, sub, 0, true);
    return s.text(html ?? sub, b.cx, b.cy, size, { color: o.color, weight: o.weight });
  });
}
// A small operation label (like "÷ 6" or "− 1") written beside a numerator or denominator.
const side = (s, html, it, t, color = C.op, size = 38, dx = 14) => {
  const r = it.rect();
  return s.text(html, r.r + dx, r.cy, size, { color, weight: 700, ax: 0 }).pop(t);
};

// A bag of marbles: rows = [[color, count, y], ...]; returns {bag, groups: [[items], ...]}.
function marbleBag(s, x, y, w, h, rows, d = 76, gap = 96) {
  const bag = s.add(bagHtml(w, h), x, y);
  const groups = rows.map(([c, n, ry]) => Array.from({ length: n }, (_, i) => s.add(marble(c, d), x + (i - (n - 1) / 2) * gap, ry)));
  return { bag, groups };
}

// A real test question as a card.
function qcard(s, x, y, head, body, choices, o = {}) {
  const ch = choices.map((c, i) => `<span class="ch-${"ABCD"[i]}" style="display:inline-flex;align-items:center;gap:12px"><b style="color:${C.dim}">${"ABCD"[i]}.</b>${c}</span>`).join("");
  const html = `<div class="card qcard"><div style="font-size:34px;color:${C.dim};margin-bottom:16px">${head}</div>` +
    `<div style="font-size:44px;line-height:1.38">${body}</div>` +
    `<div style="display:flex;gap:90px;margin-top:26px;font-size:46px;align-items:center">${ch}</div></div>`;
  return s.add(html, x, y, o);
}

function build() {

scene("S1Title", s => {
  const unit = s.text("UNIT 5", CX, 330, 44, { color: C.op, weight: 700, style: { letterSpacing: "0.3em" } });
  const title = s.text("Probability &amp; Averages", CX, 440, 120, { weight: 700 });
  const sub = s.text("SHSAT Math with Victoria", CX, 550, 48, { color: C.dim });
  unit.fadeIn(s.c(0)); title.write(s.c(0) + 0.3, 1.3); sub.fadeIn(s.c(0) + 1.5);
  const stat = s.text(`Practice tests: <b style="color:${C.neg}">8 of 13</b> questions on this topic missed`, CX, 760, 50, { color: C.dim });
  stat.fadeIn(s.c(1)); stat.fadeOut(s.c(2));
  s.text(`Count carefully. <span style="color:${C.op}">Think in totals.</span>`, CX, 760, 60, { color: C.x, weight: 600 }).fadeIn(s.c(2) + 0.3);
});

scene("S2Basics", s => {
  const top = seq(s, CX, 215, 58, ["Probability =", [`<span style="color:${C.op}">what you want</span>`, "everything possible", {}, 46]], { ax: 0.5, weight: 600 });
  top[0].fadeIn(s.c(0)); top[1].B.fadeIn(s.c(0) + 0.6, 0.5, 0); top[1].N.fadeIn(s.c(0) + 2.6); top[1].D.fadeIn(s.c(0) + 3.7);
  const BX = 470;
  const { bag, groups: [r, y, b] } = marbleBag(s, BX, 640, 560, 380, [[RED, 3, 530], [YEL, 4, 635], [BLU, 5, 740]]);
  const t1 = s.c(1);
  bag.fadeIn(t1);
  [...r, ...y, ...b].forEach((it, i) => it.pop(t1 + 0.3 + i * 0.12));
  // Counts, each one said and shown, then the total.
  const cnt = seq(s, BX, 405, 42, [col(RED, "3"), col(RED, "red") + " +", col(YEL, "4"), col(YEL, "yellow") + " +", col(BLU, "5"), col(BLU, "blue") + " =", "<b>12</b>"], { ax: 0.5 });
  const [n3, , n4, , n5, , n12] = cnt;
  [[0, 1, 1.0, r], [2, 3, 2.0, y], [4, 5, 3.1, b]].forEach(([i, j, dt, g]) => { cnt[i].fadeIn(t1 + dt, 0.4, 0); cnt[j].fadeIn(t1 + dt, 0.4, 0); g.forEach(it => it.pulse(t1 + dt, 1.15)); });
  n12.pop(s.c(2));

  // P(red): 3 and 12 fly from the counts into a real fraction, then it simplifies by 3.
  const RX = 940, FS = 62;
  const [pa, fa, , ea, fa2] = seq(s, RX, 420, 60, [`P(${col(RED, "red")}) =`, ["3", "12", { nc: RED }, FS], `<span style="display:inline-block;width:64px"></span>`, "=", ["1", "4", {}, FS]]);
  const t3 = s.c(3);
  pa.fadeIn(t3 + 0.9); fa.B.fadeIn(t3 + 1.1, 0.4, 0); r.forEach(it => it.pulse(t3 + 1.0, 1.2));
  const t4 = s.c(4);
  fly(s, "3", n3.rect(), 42, fa.N, FS, t4 - 0.2, 0.8, { color: RED });
  fly(s, "12", n12.rect(), 42, fa.D, FS, t4 + 0.3, 0.8, { weight: 700 });
  const t5 = s.c(5);
  const da = side(s, "÷ 3", fa.N, t5 - 0.7, C.op, 34), db = side(s, "÷ 3", fa.D, t5 - 0.5, C.op, 34);
  ea.fadeIn(t5 - 0.1, 0.3, 0); fa2.B.fadeIn(t5 - 0.1, 0.3, 0);
  s.morph([fa.N, da], fa2.N, t5, 0.8); s.morph([fa.D, db], fa2.D, t5 + 0.15, 0.8);

  // P(not blue): the red and yellow counts fly up into the numerator, then become 7.
  const t6 = s.c(6);
  b.forEach(it => it.tw(t6 + 0.3, 0.6, { opacity: 0.22 }));
  const [pb, pbe, fb, eb, fb2] = seq(s, RX, 595, 60, [`P(not ${col(BLU, "blue")})`, "=", [`${col(RED, "3")} + ${col(YEL, "4")}`, "12", {}, FS], "=", ["7", "12", {}, FS]]);
  pb.fadeIn(t6 + 0.2); pbe.fadeIn(t6 + 0.2); fb.B.fadeIn(t6 + 1.0, 0.4, 0);
  const [q3, qp, q4] = pieces(s, fb.N, [["3", col(RED, "3")], ["+"], ["4", col(YEL, "4")]], FS);
  const t7 = s.c(7);
  fly(s, "3", n3.rect(), 42, q3, FS, t7 - 0.1, 0.8, { color: RED }); r.forEach(it => it.pulse(t7, 1.2));
  qp.fadeIn(t7 + 0.8, 0.3, 0);
  fly(s, "4", n4.rect(), 42, q4, FS, t7 + 0.9, 0.8, { color: YEL }); y.forEach(it => it.pulse(t7 + 1.1, 1.2));
  fly(s, "12", n12.rect(), 42, fb.D, FS, t7 + 1.4, 0.8, { weight: 700 });
  const t8 = s.c(8);
  eb.fadeIn(t8 - 0.1, 0.3, 0); fb2.B.fadeIn(t8 - 0.1, 0.3, 0);
  s.morph([q3, qp, q4], fb2.N, t8, 0.8); s.morph([fb.D], fb2.D, t8 + 0.15, 0.8);

  // Same thing as 1 − P(blue): written under it, lined up on "=".
  const t9 = s.c(9);
  const [ec, one, fc, ec2, fc2] = seq(s, pbe.rect().l, 760, 60, ["=", "1 −", [col(BLU, "5"), "12", {}, FS], "=", ["7", "12", {}, FS]]);
  ec.fadeIn(t9 + 1.0, 0.4, 0); one.fadeIn(t9 + 1.1, 0.4, 0); fc.B.fadeIn(t9 + 1.6, 0.3, 0);
  fly(s, "5", n5.rect(), 42, fc.N, FS, t9 + 1.9, 0.7, { color: BLU }); b.forEach(it => it.pulse(t9 + 2.1, 1.25));
  fly(s, "12", n12.rect(), 42, fc.D, FS, t9 + 2.2, 0.7, { weight: 700 });
  ec2.fadeIn(t9 + 3.0, 0.3, 0); copyTo(s, fb2.all, fc2.all, t9 + 3.0, 0.8);

  // Prediction: 1/4 of 120 picks.
  const t10 = s.c(10);
  b.forEach(it => it.tw(t10, 0.5, { opacity: 1 }));
  const cap = seq(s, BX, 905, 40, [`<span style="color:${C.dim}">Pick &amp; put back</span>`, "<b>120</b>", `<span style="color:${C.dim}">times</span>`], { ax: 0.5 });
  cap[0].fadeIn(t10 + 2.4); cap[1].fadeIn(t10 + 3.6); cap[2].fadeIn(t10 + 3.9);
  const t11 = s.c(11);
  const [ex, fd, tm, n120, ed, thirty, reds] = seq(s, RX, 905, 56, ["expect", ["1", "4", {}, 56], "×", "120", "=", `<b style="color:${C.op}">30</b>`, col(RED, "reds")]);
  ex.fadeIn(t11); r.forEach(it => it.pulse(t11 + 0.3, 1.2));
  copyTo(s, fa2.all, fd.all, t11 + 1.3, 0.8);
  tm.fadeIn(t11 + 2.0, 0.3, 0); fly(s, "<b>120</b>", cap[1].rect(), 40, n120, 56, t11 + 2.1, 0.8);
  const t12 = s.c(12);
  ed.fadeIn(t12, 0.3, 0); thirty.pop(t12); reds.fadeIn(t12 + 0.3, 0.4, 0);
});

scene("S3TwoEvents", s => {
  s.text("Two events: list every outcome", CX, 160, 62, { weight: 700 }).fadeIn(s.c(0));
  const cw = 112, ch = 92;
  const cell = (t, cls, st = "") => `<div class="${cls}" style="width:${cw}px;height:${ch}px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;${st}">${t}</div>`;
  const box = "border:2px solid #3a5079;";
  let html = `<div style="display:grid;grid-template-columns:repeat(7,${cw}px);font-size:38px">`;
  html += cell("", "") + [1, 2, 3, 4, 5, 6].map(n => cell(n, `h-${n}`, `color:${C.dim};font-weight:600`)).join("");
  for (const c of ["H", "T"]) {
    html += cell(c, `r-${c}`, `color:${C.x};font-weight:700`);
    html += [1, 2, 3, 4, 5, 6].map(n => cell(c + n, `c-${c}${n}`, box)).join("");
  }
  html += "</div>";
  const TX = 620;
  const table = s.add(html, TX, 470);
  const t1 = s.c(1);
  table.fadeIn(t1);
  s.text(`coin ↓`, TX - 3 * cw, 378, 30, { color: C.dim }).fadeIn(t1);
  s.text(`die →`, TX - 2 * cw, 322, 30, { color: C.dim }).fadeIn(t1);
  const [o2, o6, o12] = seq(s, TX, 670, 48, ["2", "× 6", "= <b>12</b> outcomes"], { ax: 0.5 });
  o2.fadeIn(t1 + 2.4, 0.4, 0); o6.fadeIn(t1 + 3.5, 0.4, 0); o12.fadeIn(t1 + 4.8, 0.4, 0);
  // Header cells glow as the voice counts them.
  const hl = (sel, t, c = C.x) => s.ring(table.rect(sel), c, 0).pop(t).fadeOut(t + 1.6);
  hl(".r-H", t1 + 2.4); hl(".r-T", t1 + 2.6);

  // Heads AND even: the three boxes fly into the numerator, 12 comes from the outcome count.
  const t2 = s.c(2);
  const RX = 1110, FS = 60;
  const evens = ["H2", "H4", "H6"];
  evens.forEach((k, i) => s.ring(table.rect(".c-" + k), C.op, 2).pop(t2 + 1.0 + i * 0.3));
  s.text(`P(heads <b>and</b> even)`, RX, 350, 48, { ax: 0 }).fadeIn(t2);
  const [e1, fA, , e2, fA2] = seq(s, RX, 470, 60, ["=", ["3", "12", { nc: C.op }, FS], `<span style="display:inline-block;width:60px"></span>`, "=", ["1", "4", {}, FS]]);
  e1.fadeIn(t2 + 2.5, 0.4, 0); fA.B.fadeIn(t2 + 2.5, 0.4, 0);
  const t3 = s.c(3);
  evens.forEach((k, i) => fly(s, k, table.rect(".c-" + k), 38, fA.N, FS, t3 + i * 0.15, 0.9, { color: C.op }));
  fly(s, "12", o12.rect("b"), 48, fA.D, FS, s.c(4), 0.8, { weight: 700 });
  const t5 = s.c(5);
  const da = side(s, "÷ 3", fA.N, t5 - 0.5, C.op, 32), db = side(s, "÷ 3", fA.D, t5 - 0.4, C.op, 32);
  e2.fadeIn(t5, 0.3, 0); fA2.B.fadeIn(t5, 0.3, 0);
  s.morph([fA.N, da], fA2.N, t5 + 0.1, 0.7); s.morph([fA.D, db], fA2.D, t5 + 0.2, 0.7);

  // Independent: multiply the two separate chances; tops make 1, bottoms make 4.
  const t6 = s.c(6);
  s.text("independent → multiply", RX, 752, 40, { ax: 0, color: C.op }).fadeIn(t6 + 2.4);
  const [fH, tx, fE, e3, fP, ok] = seq(s, RX, 637, 60, [["1", "2", {}, FS], "×", ["1", "2", {}, FS], "=", ["1", "4", {}, FS], `<span style="color:${C.op}">✓</span>`]);
  const t7 = s.c(7), t8 = s.c(8), t9 = s.c(9);
  hl(".r-H", t7 - 0.2); fH.fadeIn(t7, 0.5, 0);
  tx.fadeIn(t8 - 0.4, 0.3, 0);
  ["h-2", "h-4", "h-6"].forEach(k => hl("." + k, t8 - 0.2, C.op)); fE.fadeIn(t8, 0.5, 0);
  e3.fadeIn(t9 - 0.2, 0.3, 0); fP.B.fadeIn(t9 - 0.2, 0.3, 0);
  s.morph([fH.N, fE.N], fP.N, t9 - 0.1, 0.8); s.morph([fH.D, fE.D], fP.D, t9, 0.8);
  ok.pop(s.c(10));

  s.text(`<b style="color:${C.op}">AND</b> → multiply`, CX, 820, 54).pop(s.c(11));
  // OR on one pick: the tops add, the bottom stays 12.
  const t12 = s.c(12);
  const orr = seq(s, CX, 930, 48, [`<b style="color:${C.x}">OR</b> (one pick) → add:`, `P(${col(RED, "red")} or ${col(YEL, "yellow")}) =`, [col(RED, "3"), "12", {}, 54], "+", [col(YEL, "4"), "12", {}, 54], "=", ["7", "12", {}, 54]], { ax: 0.5 });
  const [ol, op, g1, pl, g2, oe, g3] = orr;
  ol.fadeIn(t12); op.fadeIn(t12 + 3.0);
  g1.fadeIn(s.c(13), 0.5, 0); pl.fadeIn(s.c(14) - 0.3, 0.3, 0); g2.fadeIn(s.c(14), 0.5, 0);
  const t15 = s.c(15);
  oe.fadeIn(t15 - 0.2, 0.3, 0); g3.B.fadeIn(t15 - 0.2, 0.3, 0);
  s.morph([g1.N, g2.N], g3.N, t15 - 0.1, 0.8); s.morph([g1.D, g2.D], g3.D, t15, 0.8);
});

scene("S4NoReplace", s => {
  s.text(`${col(C.neg, "Without replacement")}: the first pick stays out`, CX, 165, 60, { weight: 700 }).fadeIn(s.c(0));
  const BX = 440;
  const { bag, groups: [r, b] } = marbleBag(s, BX, 600, 600, 330, [[RED, 4, 535], [BLU, 6, 660]], 76, 94);
  const t1 = s.c(1);
  bag.fadeIn(t1); [...r, ...b].forEach((it, i) => it.pop(t1 + 0.3 + i * 0.1));
  // The count label is built from pieces so its numbers can tick down later.

  s.text("Median, mode, and outliers", CX, 160, 62, { weight: 700 }).fadeIn(s.c(0));
  const vals = [3, 7, 7, 8, 10], X = i => CX + (i - 2) * 200, CY_ = 380;
  const card = (v, c = "#fff", bc = C.dim) => `<div class="box" style="width:160px;height:160px;border-color:${bc};color:${c};font-size:76px;font-weight:600">${v}</div>`;
  const cards = vals.map((v, i) => s.add(card(v), X(i), CY_));
  const t0 = s.c(0);
  cards.forEach((it, i) => it.fadeIn(t0 + 0.5 + i * 0.2));
  const t1 = s.c(1);
  s.ring(cards[2].rect(), C.op, 12).pop(t1 + 3.5);
  s.add(`<div style="width:360px;height:10px;border-radius:5px;background:${C.x}"></div>`, (X(1) + X(2)) / 2, 490).fadeIn(t1 + 5.5, 0.5, 0);
  const SY = 610, VY = 700, cols = [X(0) + 40, X(2), X(4) - 40];
  s.text("median", cols[1], SY, 44, { color: C.op, weight: 600 }).fadeIn(t1 + 3.5);
  s.text("7", cols[1], VY, 68, { weight: 600 }).fadeIn(t1 + 3.7);
  s.text("mode", cols[2], SY, 44, { color: C.x, weight: 600 }).fadeIn(t1 + 5.5);
  s.text("7", cols[2], VY, 68, { weight: 600 }).fadeIn(t1 + 5.7);
  s.text("mean", cols[0], SY, 44, { color: C.y, weight: 600 }).fadeIn(t1 + 7.5);
  const m1 = s.text("35 ÷ 5 = 7", cols[0], VY, 64, { weight: 600 });
  m1.fadeIn(t1 + 7.7);

  const t2 = s.c(2);
  cards[4].fadeOut(t2 + 0.2, 0.3);
  s.add(card(50, C.neg, C.neg), X(4), CY_).pop(t2 + 0.4);

  const t3 = s.c(3);
  m1.fadeOut(t3, 0.3);
  s.text(`75 ÷ 5 = <b style="color:${C.neg}">15</b>`, cols[0], VY, 64, { weight: 600 }).pop(t3 + 0.3);
  s.text("still 7", cols[1], VY + 85, 40, { color: C.op, weight: 600 }).fadeIn(t3 + 4.0);

  s.text("Outliers pull the mean, not the median.", CX, 880, 56, { color: C.x, weight: 600 }).fadeIn(s.c(4));
  s.text("Even count? Median = average of the two middle numbers.", CX, 960, 40, { color: C.dim }).fadeIn(s.c(4) + 5.0);
});

scene("S12Recap", s => {
  s.text("Your toolkit", CX, 150, 76, { weight: 700 }).fadeIn(s.c(0));
  const lines = [
    "Probability = what you want ÷ everything possible.  Not = 1 − P.",
    "AND → multiply.  No replacement: −1 on the top AND the bottom.",
    "Total = mean × count.  Totals find the missing value.",
    "Median = the middle.  Outliers pull the mean, not the median.",
  ];
  lines.forEach((l, i) => s.badge(i + 1, `<span style="color:#fff;font-weight:500">${esc(l)}</span>`, 170, 300 + i * 130, { size: 44 }).fadeIn(s.c(i + 1), 0.6, 0).set(s.c(i + 1), { sx: -30 }).tw(s.c(i + 1), 0.6, { sx: 0 }));
  s.text("Next: Workbook Unit 5 practice.  You've got this!", CX, 900, 54, { color: C.op, weight: 700 }).pop(s.c(5));
});

}
