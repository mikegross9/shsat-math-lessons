<script>

// ---------- helpers (local to Unit 8) ----------
const SUPMAP = { "⁰": "0", "¹": "1", "²": "2", "³": "3", "⁴": "4", "⁵": "5", "⁶": "6", "⁷": "7", "⁸": "8", "⁹": "9", "⁻": "−" };
const SUPRE = /[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g;
const fancy = html => html.replace(SUPRE, t => `<sup class="ex">${[...t].map(c => SUPMAP[c]).join("")}</sup>`)
  .replace(/(\d)̅/g, '<span class="ol">$1</span>');
// Math text: colored variables, unicode superscripts drawn as real exponents, d̅ as a repeating digit.
const M = s => fancy(m(s));
const col = (c, html) => `<span style="color:${c}">${html}</span>`;
const frac = (a, b) => `<span class="fr"><span>${M(a)}</span><span>${M(b)}</span></span>`;
const heading = (s, t) => s.text(t, CX, 170, 64, { weight: 700 });
const dotHTML = (c, d = 34) => `<div style="width:${d}px;height:${d}px;border-radius:50%;background:${c}"></div>`;
const lab = v => (v < 0 ? "−" : "") + String(Math.abs(Math.round(v * 100) / 100));

// Equation with real exponents, "=" at (x, y) like s.eq.
function eqx(s, str, x, y, size = 84, o = {}) {
  const i = str.indexOf("=");
  const l = str.slice(0, i).trim(), r = str.slice(i + 1).trim();
  const html = `<div class="eqrow" style="font-size:${size}px"><div class="L"><span class="side">${M(l)}</span></div>` +
    `<div class="E">=</div><div class="R"><span class="side">${M(r)}</span></div></div>`;
  const it = s.add(html, x, y, o);
  const sides = it.el.querySelectorAll(".side");
  it.L = () => rectOf(sides[0]); it.R = () => rectOf(sides[1]);
  return it;
}

// Horizontal number line drawn on a full-stage SVG. Returns the item plus px(value).
function numberLine(s, y, vmin, vmax, x0, x1, n, labelEvery, fmt = lab) {
  const px = v => x0 + (v - vmin) / (vmax - vmin) * (x1 - x0);
  let g = `<line x1="${x0 - 40}" y1="${y}" x2="${x1 + 40}" y2="${y}" stroke="#fff" stroke-width="5"/>` +
    `<path d="M${x0 - 58} ${y} l22 -14 v28 z M${x1 + 58} ${y} l-22 -14 v28 z" fill="#fff"/>`;
  for (let i = 0; i <= n; i++) {
    const v = vmin + (vmax - vmin) * i / n, x = px(v), big = i % labelEvery === 0;
    g += `<line x1="${x}" y1="${y - (big ? 18 : 10)}" x2="${x}" y2="${y + (big ? 18 : 10)}" stroke="#fff" stroke-width="${big ? 4 : 3}"/>`;
    if (big) g += `<text x="${x}" y="${y + 66}" font-size="36" text-anchor="middle" fill="${Math.abs(v) < 1e-9 ? "#fff" : "#9aa5b8"}" font-family="Avenir Next, Avenir, sans-serif" font-weight="500">${fmt(v)}</text>`;
  }
  const it = s.add(`<svg width="1920" height="1080">${g}</svg>`, 0, 0, { ax: 0, ay: 0 });
  it.px = px;
  return it;
}
// Hop arrow along a number line from xa to xb (peak h above y).
function hop(s, xa, xb, y, color, h = 80) {
  const mx = (xa + xb) / 2, cy = y - 2 * h;
  const ang = Math.atan2(y - cy, xb - mx), a1 = ang + Math.PI - 0.45, a2 = ang + Math.PI + 0.45, L = 26;
  const head = `M${xb + L * Math.cos(a1)} ${y + L * Math.sin(a1)} L${xb} ${y} L${xb + L * Math.cos(a2)} ${y + L * Math.sin(a2)}`;
  return s.add(`<svg width="1920" height="1080"><path d="M${xa} ${y} Q${mx} ${cy} ${xb} ${y}" stroke="${color}" stroke-width="6" fill="none"/>` +
    `<path d="${head}" stroke="${color}" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`, 0, 0, { ax: 0, ay: 0 });
}

// Quiz screens: draw exponents / repeating bars in the player's question text, and shrink long choices to fit.
function prettify(root) {
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const hits = []; let n;
  while ((n = tw.nextNode())) if (/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]|̅/.test(n.nodeValue)) hits.push(n);
  for (const t of hits) {
    const tmp = document.createElement("span");
    tmp.innerHTML = fancy(esc(t.nodeValue));
    t.replaceWith(...tmp.childNodes);
  }
  // Choices: keep the answer text in one span (the button is a flex row), then fit long ones.
  root.querySelectorAll(".choices:not(.fitted)").forEach(grid => {
    grid.classList.add("fitted");
    const btns = [...grid.querySelectorAll(".choice")];
    btns.forEach(b => {
      const sp = document.createElement("span");
      [...b.childNodes].filter(c => !(c.classList && c.classList.contains("letter"))).forEach(c => sp.appendChild(c));
      b.appendChild(sp);
    });
    const need = () => Math.min(...btns.map(b => {
      const sp = b.lastChild, f0 = parseFloat(getComputedStyle(b).fontSize);
      const room = b.clientWidth - parseFloat(getComputedStyle(b).paddingLeft) * 2 - 64 - 30;
      return Math.min(f0, Math.floor(f0 * room / sp.scrollWidth));
    }));
    const f0 = parseFloat(getComputedStyle(btns[0]).fontSize);
    let f = need();
    if (f < f0 * 0.9) { grid.classList.add("wide"); f = need(); }
    if (f < parseFloat(getComputedStyle(btns[0]).fontSize)) btns.forEach(b => b.style.fontSize = Math.max(30, f) + "px");
  });
}
function watchQuiz() {
  const stage = document.getElementById("stage");
  new MutationObserver(() => prettify(stage.querySelector("#ui") || document.createElement("div")))
    .observe(stage, { childList: true, subtree: true });
}

function build() {

scene("S1Title", s => {
  const unit = s.text("UNIT 8", CX, 300, 44, { color: C.op, weight: 700, style: { letterSpacing: "0.3em" } });
  const t1 = s.text("Negatives, Exponents", CX, 420, 112, { weight: 700 });

  const stat = s.text(`Practice tests: <b style="color:${C.neg}">9 of 16</b> missed, including <b style="color:${C.neg}">both</b> scientific notation questions`, CX, 820, 46, { color: C.dim });
  stat.fadeIn(s.c(1)); stat.fadeOut(s.c(2));

scene("S2Signs", s => {
  const Y = 480;
  heading(s, `Negatives on a <span style="color:${C.op}">number line</span>`).fadeIn(s.c(0));
  const NL = numberLine(s, Y, -10, 10, 160, 1760, 20, 1);
  const px = NL.px;
  NL.fadeIn(s.c(0) + 0.4, 0.8, 0);
  const lg1 = s.text(`<span style="color:${C.neg}">← subtract</span>`, 330, 640, 42, { weight: 600 });
  const lg2 = s.text(`<span style="color:${C.op}">add →</span>`, 1620, 640, 42, { weight: 600 });
  lg1.fadeIn(s.c(0) + 1.4); lg2.fadeIn(s.c(0) + 1.8);

  // −3 − 5 = −8
  const t1 = s.c(1);
  const ex1 = s.text(M("−3 − 5 = −8"), CX, 270, 76);
  ex1.write(t1, 2.6);
  const dot = s.add(dotHTML(C.x), px(-3), Y);
  dot.pop(t1 + 0.6);
  const h1 = hop(s, px(-3), px(-8), Y - 22, C.neg);
  h1.fadeIn(t1 + 1.4, 0.5, 0);
  dot.moveTo(t1 + 1.4, 1.4, px(-8), Y);
  const l1 = s.text("− 5", px(-5.5), Y - 130, 44, { color: C.neg, weight: 700 });
  l1.fadeIn(t1 + 1.6);

  // −3 − (−5) = −3 + 5 = 2
  const t2 = s.c(2);
  [ex1, h1, l1].forEach(it => it.fadeOut(t2, 0.4));
  dot.moveTo(t2, 0.6, px(-3), Y);
  const ex2 = s.text(`${M("−3 ")}${col(C.neg, M("− (−5)"))}  ${M("=  −3 ")}${col(C.op, M("+ 5"))}${M("  =  2")}`, CX, 270, 76, { style: { whiteSpace: "pre" } });
  ex2.write(t2 + 0.3, 3.4);
  const h2 = hop(s, px(-3), px(2), Y - 22, C.op, 90);
  h2.fadeIn(t2 + 3.0, 0.5, 0);
  dot.moveTo(t2 + 3.0, 1.4, px(2), Y);
  const l2 = s.text("+ 5", px(-0.5), Y - 140, 44, { color: C.op, weight: 700 });
  l2.fadeIn(t2 + 3.2);

  // sign rules for × and ÷
  const t3 = s.c(3);
  [lg1, lg2].forEach(it => it.fadeOut(t3, 0.4));
  const card = (x, c, head, ex) => s.add(`<div class="card" style="border-color:${c};width:640px;padding:26px 20px">` +
    `<div style="font-size:46px;font-weight:700;color:${c};margin-bottom:14px">${head}</div><div style="font-size:60px">${M(ex)}</div></div>`, x, 780);
  const cA = card(560, C.op, "Same signs → +", "(−4)(−6) = 24");
  const cB = card(1360, C.neg, "Different signs → −", "−20 ÷ 5 = −4");
  cA.fadeIn(t3 + 2.0); cB.fadeIn(t3 + 4.2);

  // absolute value = distance
  const t4 = s.c(4);
  [cA, cB, ex2, h2, l2].forEach(it => it.fadeOut(t4, 0.4));
  dot.fadeOut(t4, 0.4);
  const d7 = s.add(dotHTML(C.x), px(-7), Y); d7.pop(t4 + 0.5);
  const br = s.add(`<svg width="1920" height="1080"><path d="M${px(-7)} ${Y + 80} v28 H${px(0)} v-28" stroke="${C.x}" stroke-width="6" fill="none"/></svg>`, 0, 0, { ax: 0, ay: 0 });
  br.write(t4 + 1.0, 1.0);
  s.text("7 units from 0", px(-3.5), Y + 150, 40, { color: C.x, weight: 600 }).fadeIn(t4 + 1.6);
  const av = s.text(M("|−7| = 7"), CX, 790, 92, { weight: 600 });
  av.fadeIn(t4 + 2.4);
  s.text("Absolute value = distance from 0. Never negative.", CX, 900, 46, { color: C.dim }).fadeIn(t4 + 3.2);
});

scene("S3Order", s => {
  heading(s, "Order of operations").fadeIn(s.c(0));
  const xs = [420, 780, 1140, 1500];
  const steps = [["( )", "Parentheses"], ["a²", "Exponents"], ["× ÷", "Multiply, divide"], ["+ −", "Add, subtract"]];
  const boxes = steps.map(([sym, cap], i) => s.add(`<div class="box" style="width:290px;height:128px;flex-direction:column;border-color:${i < 2 ? "#fff" : C.op}">` +
    `<div style="font-size:54px;font-weight:600">${M(sym)}</div><div style="font-size:28px;color:${C.dim}">${cap}</div></div>`, xs[i], 300));
  const arrows = [0, 1, 2].map(i => s.text("→", (xs[i] + xs[i + 1]) / 2, 300, 50, { color: C.dim }));
  boxes.forEach((b, i) => { b.fadeIn(s.c(0) + 0.6 + i * 0.9, 0.5, 0); if (i < 3) arrows[i].fadeIn(s.c(0) + 1.0 + i * 0.9, 0.4, 0); });

  const t1 = s.c(1);
  const lr = s.text("left to right", 1320, 400, 38, { color: C.x, weight: 600 });
  lr.fadeIn(t1);
  const ex = s.text(M("20 ÷ 4 × 5  =  5 × 5  =  25"), CX, 560, 80, { style: { whiteSpace: "pre" } });
  ex.write(t1 + 3.0, 3.0);
  const ok = s.text("✓", 1560, 560, 80, { color: C.op, weight: 700 }); ok.pop(t1 + 6.2);
  const bad = s.text(`not <span style="text-decoration:line-through;text-decoration-color:${C.neg};text-decoration-thickness:5px">${M("20 ÷ 20 = 1")}</span>`, CX, 690, 56, { color: C.neg });
  bad.fadeIn(t1 + 6.8);

  const t2 = s.c(2);
  [ex, ok, bad].forEach(it => it.fadeOut(t2, 0.4));
  const frame = (x, c) => s.add(`<div style="width:680px;height:400px;border:4px solid ${c};border-radius:28px;background:rgba(255,255,255,0.03)"></div>`, x, 665);
  const fL = frame(560, C.neg), fR = frame(1360, C.op);
  const L1 = s.text(M("−3²"), 560, 545, 100, { weight: 600 });
  const L2 = s.text(M("= −(3 × 3)"), 560, 655, 62);
  const L3 = s.text(M("= −9"), 560, 750, 76, { color: C.neg, weight: 700 });
  const L4 = s.text("only the 3 is squared", 560, 825, 34, { color: C.dim });
  fL.fadeIn(t2 + 0.3); L1.fadeIn(t2 + 0.6); L2.fadeIn(t2 + 2.6); L3.pop(t2 + 4.4); L4.fadeIn(t2 + 4.8);

  const t3 = s.c(3);
  const R1 = s.text(M("(−3)²"), 1360, 545, 100, { weight: 600 });
  const R2 = s.text(M("= (−3)(−3)"), 1360, 655, 62);
  const R3 = s.text(M("= 9"), 1360, 750, 76, { color: C.op, weight: 700 });
  const R4 = s.text("the whole −3 is squared", 1360, 825, 34, { color: C.dim });
  fR.fadeIn(t3); R1.fadeIn(t3 + 0.3); R2.fadeIn(t3 + 1.6); R3.pop(t3 + 3.4); R4.fadeIn(t3 + 3.8);

  const t4 = s.c(4);
  [fL, fR, L1, L2, L3, L4, R1, R2, R3, R4, lr].forEach(it => it.fadeOut(t4, 0.4));
  const f1 = s.add(`<div style="font-size:84px">${frac("8 + 4", "2 − 5")}</div>`, 700, 640);
  const f2 = s.add(`<div style="font-size:84px;display:flex;align-items:center;gap:34px"><span>=</span>${frac("12", "−3")}</div>`, 1045, 640);
  const f3 = s.text(M("=  −4"), 1340, 640, 84, { color: C.x, weight: 700, style: { whiteSpace: "pre" } });
  f1.fadeIn(t4 + 0.5);
  const rt = f1.rect(".fr > span:first-child"), rb = f1.rect(".fr > span:last-child");
  const shrink = (r, dy) => ({ ...r, h: r.h - 14, cy: r.cy + dy });
  s.ring(shrink(rt, -7), C.op, 6).pop(t4 + 1.6); s.ring(shrink(rb, 7), C.op, 6).pop(t4 + 2.1);
  s.text("top", rt.l - 40, rt.cy, 38, { color: C.op, weight: 600, ax: 1 }).fadeIn(t4 + 1.6);
  s.text("bottom", rb.l - 40, rb.cy, 38, { color: C.op, weight: 600, ax: 1 }).fadeIn(t4 + 2.1);
  f2.fadeIn(t4 + 3.0); f3.fadeIn(t4 + 4.2);
  s.text("A fraction bar groups the top and the bottom.", CX, 880, 50, { color: C.x, weight: 600 }).fadeIn(t4 + 4.8);
});

scene("S4Exponents", s => {
  heading(s, "Exponent rules").fadeIn(s.c(0));
  s.text(M("2³ = 2 × 2 × 2 = 8"), CX, 285, 76).write(s.c(0) + 0.8, 2.4);

  const t1 = s.c(1);
  const rules = [["x³ · x⁴ = x⁷", "multiply → add"], ["x⁷ ÷ x⁴ = x³", "divide → subtract"], ["(x³)² = x⁶", "power of a power → ×"]];
  rules.forEach(([e, note], i) => {
    const y = 430 + i * 120, t = t1 + 0.5 + i * 2.6;
    eqx(s, e, 330, y, 62).fadeIn(t);
    s.text(note, 560, y, 36, { color: C.op, weight: 600, ax: 0 }).fadeIn(t + 0.5);
  });
  s.text("same base", 330, 360, 34, { color: C.dim }).fadeIn(t1);

  const t2 = s.c(2);
  const lad = [["10² = 100", 0], ["10¹ = 10", 0], ["10⁰ = 1", 0], ["10⁻¹ = 1/10 = 0.1", 1], ["10⁻² = 1/100 = 0.01", 1]];
  const LX = 1350;
  const rows = lad.map(([e], i) => eqx(s, e, LX, 380 + i * 95, 56));
  const downs = [0, 1, 2, 3].map(i => s.text("÷ 10 ↓", 1140, 427 + i * 95, 32, { color: C.op, weight: 600, ax: 1 }));
  rows[0].fadeIn(t2 + 0.3); rows[1].fadeIn(t2 + 2.6); downs[0].fadeIn(t2 + 2.4);
  rows[2].fadeIn(t2 + 4.4); downs[1].fadeIn(t2 + 4.2);
  const r0 = rows[2].L(), r1 = rows[2].R();
  s.ring({ cx: (r0.l + r1.r) / 2, cy: r0.cy, w: r1.r - r0.l, h: r0.h }, C.x, 14).pop(t2 + 5.8);
  s.text("not 0!", r1.r + 50, r0.cy, 40, { color: C.x, weight: 700, ax: 0 }).fadeIn(t2 + 7.5);

  const t3 = s.c(3);
  downs[2].fadeIn(t3); rows[3].fadeIn(t3 + 0.3); downs[3].fadeIn(t3 + 1.3); rows[4].fadeIn(t3 + 1.6);

  const t4 = s.c(4);
  s.text(`${M("√49 = 7")}<span style="color:${C.dim};font-size:0.7em">,  because ${M("7² = 49")}</span>`, CX, 880, 60).fadeIn(t4);
  const sq = [1, 4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144].map(v => v === 49 ? `<b style="color:${C.x}">${v}</b>` : v).join("   ");
  s.text(`<span style="color:${C.dim}">perfect squares:</span>   ${sq}`, CX, 965, 38, { style: { whiteSpace: "pre" } }).fadeIn(t4 + 1.0);
});

scene("S5Compare", s => {

  const NL = numberLine(s, Y, -0.2, 0, 260, 1660, 20, 5, v => v === 0 ? "0" : "−" + Math.abs(v).toFixed(2));

  q.fadeIn(t1);

  const t2 = s.c(2);
  const conv = s.text(M("−1/6 = −0.1666…  ≈  −0.167"), CX, 655, 64, { style: { whiteSpace: "pre" } });

    for (let i = 0; i < k; i++) g += `<rect x="${i * 600 / k + 2}" y="2" width="${600 / k - 4}" height="56" rx="6" fill="${i === 0 ? C.op : "none"}" stroke="#fff" stroke-width="3"/>`;
    return s.add(`<svg width="604" height="60">${g}</svg>`, 1500, y);
  };
  s.text(M("1/4"), 1140, 670, 52, { weight: 600, ax: 1 }).fadeIn(t4); bar(4, 670).fadeIn(t4, 0.6, 0);
  s.text(M("1/5"), 1140, 770, 52, { weight: 600, ax: 1 }).fadeIn(t4 + 1.0); bar(5, 770).fadeIn(t4 + 1.0, 0.6, 0);
  s.text(`same top, bigger bottom → ${col(C.x, "smaller")}`, 1380, 870, 42, { weight: 600 }).fadeIn(t4 + 2.4);
});

// One row of digit cells with a movable decimal point; hops the point from gap a to gap b.
function digitRow(s, digits, x0, y, gapFrom, gapTo, t, dt = 0.5) {
  const W_ = 74;
  const cells = digits.map((d, i) => s.text(d, x0 + i * W_ + W_ / 2, y, 100, { weight: 500 }));
  const gx = g => x0 + (g + 1) * W_;
  const pt = s.add(dotHTML(C.x, 20), gx(gapFrom), y + 34);
  const dir = Math.sign(gapTo - gapFrom), n = Math.abs(gapTo - gapFrom);
  const hops = [];
  for (let k = 0; k < n; k++) {
    const a = gx(gapFrom + k * dir), b = gx(gapFrom + (k + 1) * dir);
    hops.push(hop(s, a, b, y - 62, C.op, 26));
    hops.push(s.text(String(k + 1), (a + b) / 2, y - 112, 32, { color: C.op, weight: 700 }));
  }
  return {
    cells, pt, hops,
    play(t0) {
      cells.forEach((c, i) => c.fadeIn(t0 + i * 0.08, 0.4, 0));
      pt.pop(t0 + 0.8);
      for (let k = 0; k < n; k++) {
        const tk = t0 + 1.4 + k * dt;
        hops[2 * k].fadeIn(tk, 0.25, 0); hops[2 * k + 1].fadeIn(tk, 0.25, 0);
        pt.moveTo(tk, dt * 0.9, gx(gapFrom + (k + 1) * dir), y + 34);
      }
      return t0 + 1.4 + n * dt;
    },
  };
}

function questionCard(s, x, y, mark) {
  const ch = [["A", "2.5 × 10²"], ["B", "4.0 × 10²"], ["C", "2.5 × 10³"], ["D", "4.0 × 10³"]].map(([L, v]) => {
    const c = mark && L === "C" ? C.neg : mark && L === "A" ? C.op : "#fff";
    return `<span style="color:${c};margin-right:56px"><b>${L}.</b> ${M(v)}</span>`;
  }).join("");
  const html = `<div class="card" style="width:1500px;white-space:normal;text-align:left;padding:34px 60px">` +
    `<div style="font-size:34px;color:${C.dim};margin-bottom:18px">Practice Test 2 · Question 6</div>` +
    `<div style="font-size:46px;line-height:1.35;margin-bottom:26px">The number of grey pebbles in a park is ${M("1.8 × 10⁸")}. The number of red stones in the same park is ${M("7.2 × 10⁵")}. ` +
    `In scientific notation, how many times greater is the number of grey pebbles than the number of red stones?</div>` +
    `<div style="font-size:48px;white-space:nowrap">${ch}</div></div>`;
  return s.add(html, x, y);
}
