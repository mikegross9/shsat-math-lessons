<script>

// ---------- geometry helpers (this unit only) ----------
// Points are {x, y} in stage pixels. Angles are math degrees: 0 = right, 90 = up, counterclockwise.
const RAD = Math.PI / 180;
const at = (V, deg, r) => ({ x: V.x + r * Math.cos(deg * RAD), y: V.y - r * Math.sin(deg * RAD) });
const dirOf = (A, B) => Math.atan2(A.y - B.y, B.x - A.x) / RAD;
const mid = (A, B) => ({ x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 });
const f1 = v => v.toFixed(1);
const pp = P => `${f1(P.x)} ${f1(P.y)}`;
const WHITE = "#ffffff";

function arcD(V, r, a1, a2) {
  let d = ((a2 - a1) % 360 + 360) % 360; if (d < 0.01) d = 360;
  const p1 = at(V, a1, r);
  if (d > 359.9) { const pm = at(V, a1 + 180, r); return `M${pp(p1)} A${r} ${r} 0 0 0 ${pp(pm)} A${r} ${r} 0 0 0 ${pp(p1)}`; }
  return `M${pp(p1)} A${r} ${r} 0 ${d > 180 ? 1 : 0} 0 ${pp(at(V, a1 + d, r))}`;
}
const wedgeD = (V, r, a1, a2) => `M${pp(V)} L` + arcD(V, r, a1, a2).slice(1) + " Z";

// An SVG drawn in stage coordinates, as one Item whose origin (for moving, rotating, popping) is O.
// Paths marked data-draw are revealed along their length by draw(); data-fade parts fade in with them.
function shp(s, inner, O, o = {}) {
  const it = s.add(`<svg width="1" height="1" style="display:block;overflow:visible"><g transform="translate(${f1(-O.x)} ${f1(-O.y)})">${inner}</g></svg>`, O.x, O.y, o);
  const dr = [...it.el.querySelectorAll("[data-draw]")], fd = [...it.el.querySelectorAll("[data-fade]")];
  dr.forEach(p => { p._L = p.getTotalLength() + 2; p.style.strokeDasharray = `${p._L} ${p._L}`; });
  const ap = Item.prototype.apply;
  it.apply = st => {
    ap.call(it, { ...st, clip: 100 });
    const k = st.clip / 100;
    dr.forEach(p => { p.style.strokeDashoffset = p._L * (1 - k); });
    fd.forEach(p => { p.style.opacity = k * +p.dataset.fade; });
  };
  it.apply(it.base);
  return it;
}
const draw = (it, t, d = 0.8) => it.set(t, { clip: 0, opacity: 1 }).tw(t, d, { clip: 100 }, "inout");
const stroke = (c, w) => `stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" fill="none"`;
function seg(s, A, B, o = {}) {
  return shp(s, `<path data-draw d="M${pp(A)} L${pp(B)}" ${stroke(o.color || WHITE, o.w || 6)}/>`, A, o);
}
function path(s, pts, o = {}) {
  const d = "M" + pts.map(pp).join(" L") + (o.close ? " Z" : "");
  return shp(s, `<path data-draw d="${d}" ${stroke(o.color || WHITE, o.w || 6)}/>`, o.origin || pts[0], o);
}
// Angle mark: translucent wedge plus an arc that sweeps from a1 to a2 (counterclockwise).
function ang(s, V, r, a1, a2, color, o = {}) {
  return shp(s, `<path data-fade="${o.fo ?? 0.3}" d="${wedgeD(V, r, a1, a2)}" fill="${color}"/>` +
    `<path data-draw d="${arcD(V, r, a1, a2)}" ${stroke(color, o.w || 6)}/>`, V, o);
}
function rmark(s, V, a1, size = 36, color = WHITE) {
  const p1 = at(V, a1, size), p3 = at(V, a1 + 90, size), p2 = at(p1, a1 + 90, size);
  return shp(s, `<path data-draw d="M${pp(p1)} L${pp(p2)} L${pp(p3)}" ${stroke(color, 5)}/>`, V);
}
function ticks(s, A, B, color = WHITE) {
  const M = mid(A, B), d = dirOf(A, B);
  return shp(s, `<path data-draw d="M${pp(at(M, d + 90, 20))} L${pp(at(M, d - 90, 20))}" ${stroke(color, 6)}/>`, M);
}
const dotIt = (s, P, color = WHITE, r = 11) => shp(s, `<circle cx="${f1(P.x)}" cy="${f1(P.y)}" r="${r}" fill="${color}"/>`, P);
const lab = (s, html, V, deg, r, size = 48, o = {}) => { const p = at(V, deg, r); return s.text(html, p.x, p.y, size, { weight: 600, ...o }); };
const deg = (n, color) => `<span style="color:${color}">${n}°</span>`;
const XD = `<span class="x">x</span>°`;
const ANG = `<svg style="display:inline-block;width:0.62em;height:0.62em;margin-right:0.06em;vertical-align:-0.02em;overflow:visible" viewBox="0 0 10 10"><path d="M9.5 0.5 L0.5 9.5 H10" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round"/></svg>`;
const col = (h, c) => `<span style="color:${c}">${h}</span>`;

// ---------- Manim-style moves (this unit only) ----------
// A line of work built from separate pieces, laid out left to right from x (o.ax = 0.5 centers it on x),
// so single numbers can fly into their slot or morph in place. Returns the piece Items.
function mrow(s, pieces, x, y, size, o = {}) {
  const gap = size * 0.26;
  const its = pieces.map(p => s.text(p, 0, y, size, { ax: 0, weight: o.weight || 500, color: o.color || WHITE }));
  const ws = its.map(it => it.rect().w);
  let cx = x - (ws.reduce((a, b) => a + b, 0) + gap * (its.length - 1)) * (o.ax || 0);
  its.forEach((it, i) => { it.base.x = cx; it.apply(it.base); cx += ws[i] + gap; });
  return its;
}
// A copy of text Item `src` (a label on the figure, or a number in a line of work) flies from where it is at time t
// into `dst`, growing or shrinking to dst's size; dst appears as the copy lands. The source stays where it is.
// The copy lands left-aligned with dst (so "50" lands on the "50" of "50°"), or on the text `part` of dst.
// (Text Items only: the figure's SVG Items override apply() and measure as a 1-pixel box.)
function fly(s, src, dst, t, d = 0.9, part) {
  const off = (it, tt) => { const st = it.state(tt), b = it.base; return { x: st.x - b.x + st.sx, y: st.y - b.y + st.sy }; };
  const r0 = src.rect(), o0 = off(src, t), r1 = part ? s.partBox(dst, part, 0, true) : dst.rect(), o1 = off(dst, t + d);
  const k = (parseFloat(dst.el.style.fontSize) / parseFloat(src.el.style.fontSize)) || 1;
  const p0 = { x: (r0.l + r0.r) / 2 + o0.x, y: (r0.t + r0.b) / 2 + o0.y };
  const p1 = { x: r1.l + r0.w * k / 2 + o1.x, y: (dst.rect().t + dst.rect().b) / 2 + o1.y };
  const g = s.add(src.el.innerHTML, p0.x, p0.y);
  g.el.style.cssText = src.el.style.cssText; g.el.style.transformOrigin = "50% 50%"; g.apply(g.base);
  g.set(t, { opacity: 1 });
  g.tw(t, d, { x: p1.x, y: p1.y, scale: k }, "inout");
  g.tw(t + d * 0.85, d * 0.2, { opacity: 0 }, "linear");
  dst.tw(t + d * 0.8, d * 0.25, { opacity: 1 }, "linear");
  return g;
}
// Evaluate part of a line in place: `from` collapses into the new piece `to` (placed where `from` started),
// and the pieces after it slide left to close the gap.
function evalIn(s, from, to, after, t, d = 0.7) {
  const dx = to.rect().w - from.rect().w;
  from.fadeOut(t, 0.15);
  s.morph([from], to, t, d);
  after.forEach(it => it.shift(t, d, dx, 0));
}

// Static SVG of her Practice Test 1 question 8 (for the question card).
function figM8() {
  const R = { x: 40, y: 250 }, U = { x: 360, y: 250 }, V = { x: 530, y: 250 };
  const T = { x: 200, y: 250 - 160 * Math.tan(50 * RAD) };
  const l = (A, B) => `<path d="M${pp(A)} L${pp(B)}" ${stroke(WHITE, 5)}/>`;
  const tk = (A, B) => { const M = mid(A, B), d = dirOf(A, B); return l(at(M, d + 90, 13), at(M, d - 90, 13)); };
  const t = (P, s, c = WHITE, sz = 34) => `<text x="${f1(P.x)}" y="${f1(P.y)}" font-size="${sz}" fill="${c}" font-weight="600" text-anchor="middle" dominant-baseline="central">${s}</text>`;
  return `<svg width="580" height="300" viewBox="0 0 580 300">` + l(R, V) + l(R, T) + l(T, U) + tk(R, T) + tk(T, U) +
    `<path d="${arcD(T, 38, 230, 310)}" ${stroke(C.op, 4)}/><path d="${arcD(U, 40, 0, 130)}" ${stroke(C.x, 4)}/>` +
    t(at(T, 270, 75), "80°", C.op) + t(at(U, 65, 74), `<tspan font-style="italic" fill="${C.x}">x</tspan>°`) +
    t({ x: R.x - 4, y: R.y + 30 }, "R") + t({ x: T.x, y: T.y - 30 }, "T") + t({ x: U.x, y: U.y + 32 }, "U") + t({ x: V.x - 4, y: V.y + 32 }, "V") + `</svg>`;
}

function build() {

scene("S1Title", s => {
  const unit = s.text("UNIT 6", CX, 330, 44, { color: C.op, weight: 700, style: { letterSpacing: "0.3em" } });
  const title = s.text("Angles", CX, 440, 132, { weight: 700 });

  unit.fadeIn(s.c(0)); title.write(s.c(0) + 0.3, 1.0); sub.fadeIn(s.c(0) + 1.3);
  // a small angle sweeping open beside the title

  draw(seg(s, V, at(V, 0, 190), { color: C.dim, w: 7 }), s.c(0) + 0.4, 0.5);

  const stat = s.text(`Practice tests: <b style="color:${C.neg}">4 of 7</b> angle questions missed`, CX, 760, 50, { color: C.dim });
  stat.fadeIn(s.c(1)); stat.fadeOut(s.c(2));

scene("S2Names", s => {

  const P = { x: 400, y: 560 }, Q = at(P, 0, 440), N = at(P, 42, 400);
  const t0 = s.c(0);
  draw(seg(s, P, Q), t0 + 0.4, 0.8); draw(seg(s, P, N), t0 + 0.9, 0.8);
  dotIt(s, P, C.x, 12).pop(t0 + 1.6);

  const t2 = s.c(2);
  draw(seg(s, V1, at(V1, 0, 240)), t2, 0.6); draw(seg(s, V1, at(V1, 90, 200)), t2 + 0.3, 0.6);
  draw(ang(s, V1, 80, 0, 90, C.op, { fo: 0.25 }), t2 + 0.8, 0.6);
  draw(rmark(s, V1, 0, 40, C.op), t2 + 1.2, 0.4);

  dotIt(s, V3).fadeIn(t4 + 0.2, 0.3, 0);
  draw(ang(s, V3, 80, 0, 360, C.op, { fo: 0.25 }), t4 + 0.5, 1.4);
  s.text(deg(360, C.op), V3.x - 160, V3.y - 70, 50, { weight: 600 }).pop(t4 + 1.9);
  s.text("around a point", V3.x - 20, 965, 40, { color: C.dim }).fadeIn(t4 + 2.1);
});

scene("S3Cross", s => {
  s.text("When two lines cross", CX, 175, 64, { weight: 700 }).fadeIn(s.c(0));
  const X = { x: 600, y: 590 };
  const t0 = s.c(0);
  draw(seg(s, at(X, 180, 360), at(X, 0, 360)), t0 + 0.3, 0.9);
  draw(seg(s, at(X, 230, 330), at(X, 50, 330)), t0 + 0.9, 0.9);
  const r = 95;
  const w0 = ang(s, X, r, 0, 50, C.x), w1 = ang(s, X, r, 50, 180, C.y), w2 = ang(s, X, r, 180, 230, C.x), w3 = ang(s, X, r, 230, 360, C.y);

  const RX = 1100;
  const t1 = s.c(1);
  draw(w0, t1 + 0.3); draw(w1, t1 + 0.9);
  s.text(`Linear pair  →  <span style="color:${C.op}">add to 180°</span>`, RX, 330, 48, { ax: 0, weight: 600 }).fadeIn(t1 + 1.0);
  const t2 = s.c(2);
  draw(w2, t2 + 0.2);
  w0.pulse(t2 + 1.2, 1.15); w2.pulse(t2 + 1.2, 1.15);
  s.text(`Vertical angles  →  <span style="color:${C.op}">equal</span>`, RX, 430, 48, { ax: 0, weight: 600 }).fadeIn(t2 + 0.8);
  // "one angle is fifty, its partner is fifty": a copy of the 50° corner spins half a turn about the crossing
  // onto its vertical partner, and the 50 goes with it. Then the same for 130.
  const t3 = s.c(3);
  const l50 = lab(s, deg(50, C.x), X, 25, 160); l50.pop(t3 + 1.2);
  const spin = ang(s, X, r, 0, 50, C.x, { fo: 0.7 });
  spin.show(t3 + 2.0); spin.tw(t3 + 2.1, 1.0, { rot: 180 }, "inout"); spin.fadeOut(t3 + 3.3, 0.4);
  fly(s, l50, lab(s, deg(50, C.x), X, 205, 160), t3 + 2.1, 1.0);
  draw(w3, t3 + 3.7);
  const l130 = lab(s, deg(130, C.y), X, 115, 160); l130.pop(t3 + 4.8);
  const spin2 = ang(s, X, r, 50, 180, C.y, { fo: 0.6 });
  spin2.show(t3 + 5.0); spin2.tw(t3 + 5.0, 0.9, { rot: 180 }, "inout"); spin2.fadeOut(t3 + 6.0, 0.4);
  fly(s, l130, lab(s, deg(130, C.y), X, 295, 160), t3 + 5.0, 0.9);

  // complementary: a right angle split in two
  const t4 = s.c(4);
  const V = { x: 1110, y: 780 };
  draw(seg(s, V, at(V, 0, 200)), t4, 0.5); draw(seg(s, V, at(V, 90, 170)), t4 + 0.2, 0.5); draw(seg(s, V, at(V, 35, 190), { color: C.dim }), t4 + 0.5, 0.5);
  draw(ang(s, V, 80, 0, 35, C.neg), t4 + 0.8, 0.5); draw(ang(s, V, 80, 35, 90, C.op), t4 + 1.1, 0.5);
  s.text(`<b>Complementary</b> = 90°`, 1350, 700, 46, { ax: 0 }).fadeIn(t4 + 0.6);
  // supplementary: a straight angle split in two
  const t5 = s.c(5);
  const S = { x: 1220, y: 930 };
  draw(seg(s, at(S, 180, 110), at(S, 0, 110)), t5, 0.5); draw(seg(s, S, at(S, 130, 120), { color: C.dim }), t5 + 0.3, 0.5);
  draw(ang(s, S, 60, 0, 130, C.op), t5 + 0.6, 0.6); draw(ang(s, S, 60, 130, 180, C.neg), t5 + 1.0, 0.5);
  s.text(`<b>Supplementary</b> = 180°`, 1350, 890, 46, { ax: 0 }).fadeIn(t5 + 0.5);
});

scene("S4Triangle", s => {
  s.text("A triangle adds to 180°", CX, 175, 64, { weight: 700 }).fadeIn(s.c(0));
  const A = { x: 220, y: 840 }, B = { x: 880, y: 840 };
  const Ct = at(A, 50, 660 * Math.sin(60 * RAD) / Math.sin(70 * RAD));
  const t0 = s.c(0), r = 90;
  const tri = path(s, [A, B, Ct], { close: true }); draw(tri, t0 + 0.3, 1.4);
  const wA = ang(s, A, r, 0, 50, C.x), wB = ang(s, B, r, 120, 180, C.y), wC = ang(s, Ct, r, 230, 300, C.neg);
  draw(wA, t0 + 1.6, 0.5); draw(wC, t0 + 1.9, 0.5); draw(wB, t0 + 2.2, 0.5);
  const lA = lab(s, deg(50, C.x), A, 25, 145), lB = lab(s, deg(60, C.y), B, 150, 140), lC = lab(s, deg(70, C.neg), Ct, 265, 140);
  [lA, lC, lB].forEach((l, i) => l.fadeIn(t0 + 1.9 + i * 0.3, 0.4, 0));

  // tear off the corners...
  const t1 = s.c(1), O = { x: 1450, y: 840 };
  const cA = ang(s, A, r, 0, 50, C.x, { fo: 0.6 }), cB = ang(s, B, r, 120, 180, C.y, { fo: 0.6 }), cC = ang(s, Ct, r, 230, 300, C.neg, { fo: 0.6 });
  [cA, cC, cB].forEach((c, i) => c.show(t1 + 0.3 + i * 0.3));
  cA.shift(t1 + 0.5, 0.5, -30, 20); cC.shift(t1 + 0.8, 0.5, 0, -40); cB.shift(t1 + 1.1, 0.5, 30, 20);
  [wA, wB, wC].forEach(w => w.tw(t1 + 0.4, 0.5, { opacity: 0.35 }));
  // ...and line them up
  const t2 = s.c(2);
  const fan = [seg(s, at(O, 180, 300), at(O, 0, 300), { color: C.dim })];
  draw(fan[0], t2, 0.6);
  cA.tw(t2 + 0.3, 1.2, { x: O.x, y: O.y, sx: 0, sy: 0 }, "inout");
  cC.tw(t2 + 0.7, 1.4, { x: O.x, y: O.y, sx: 0, sy: 0, rot: 180 }, "inout");
  cB.tw(t2 + 1.1, 1.2, { x: O.x, y: O.y, sx: 0, sy: 0 }, "inout");
  // each corner's number travels with it
  const fA = lab(s, deg(50, C.x), O, 25, 140), fC = lab(s, deg(70, C.neg), O, 85, 140), fB = lab(s, deg(60, C.y), O, 150, 140);
  fly(s, lA, fA, t2 + 0.3, 1.2); fly(s, lC, fC, t2 + 0.7, 1.4); fly(s, lB, fB, t2 + 1.1, 1.2);

  const sum = mrow(s, [deg(50, C.x), "+", deg(70, C.neg), "+", deg(60, C.y), "=", "180°"], O.x, 930, 54, { ax: 0.5, weight: 600 });
  sum.slice(0, 5).forEach((it, i) => it.fadeIn(t2 + 2.4 + i * 0.12, 0.4, 0));
  sum[5].fadeIn(t2 + 3.6, 0.3, 0); sum[6].pop(t2 + 3.7);
  fan.push(fA, fC, fB, sweep, ...sum);

  // isosceles and equilateral
  const t3 = s.c(3);
  [tri, wA, wB, wC, lA, lB, lC, cA, cB, cC, ...fan].forEach(it => it.fadeOut(t3, 0.5));
  const iT = { x: 560, y: 880 - 189 * Math.tan(70 * RAD) }, iL = { x: 371, y: 880 }, iR = { x: 749, y: 880 };
  draw(path(s, [iL, iR, iT], { close: true }), t3 + 0.6, 1.2);
  draw(ticks(s, iL, iT, C.x), t3 + 1.8, 0.3); draw(ticks(s, iR, iT, C.x), t3 + 2.0, 0.3);
  draw(ang(s, iL, 75, 0, 70, C.x), t3 + 3.4, 0.5); draw(ang(s, iR, 75, 110, 180, C.x), t3 + 3.6, 0.5);
  draw(ang(s, iT, 75, 250, 290, C.op), t3 + 3.9, 0.5);

// The big M8 figure used by the walkthrough scenes.
function bigM8(s, shown) {
  const R = { x: 150, y: 830 }, U = { x: 750, y: 830 }, V = { x: 1010, y: 830 };
  const T = { x: 450, y: 830 - 300 * Math.tan(50 * RAD) };
  const o = shown ? { show: true } : {};
  const items = [seg(s, R, V, o), seg(s, R, T, o), seg(s, T, U, o)];
  items.push(lab(s, "R", R, 215, 50, 52, o), lab(s, "T", T, 90, 48, 52, o), lab(s, "U", U, 270, 50, 52, o), lab(s, "V", V, 270, 50, 52, o));
  const l80 = lab(s, deg(80, C.op), T, 270, 125, 48, o);
  items.push(ang(s, T, 80, 230, 310, C.op, o), l80);
  const xArc = ang(s, U, 85, 0, 130, WHITE, { ...o, fo: 0.12, w: 5 });
  const xLab = lab(s, XD, U, 65, 150, 56, o);
  return { R, U, V, T, xArc, xLab, l80 };
}

  s.morph([c[0]], d[0], t5 + 1.7, 0.9); s.morph([c[1]], d[1], t5 + 1.7, 0.9); s.morph([c[2], c[3], c[4]], d[2], t5 + 1.7, 0.9);
  const l = d[0].rect(), r = d[2].rect();
  s.ring({ cx: (l.l + r.r) / 2, cy: l.cy, w: r.r - l.l, h: l.h }, C.x, 18).pop(t5 + 3.1);
  // ...and x's value is written on the figure.
  const xVal = lab(s, `${XD} = 130°`, U, 65, 175, 52);
  fly(s, d[2], xVal, t5 + 3.2, 0.9, "130"); F.xLab.fadeOut(t5 + 3.8, 0.3);
});

scene("S10Check", s => {
  const F = bigM8(s, true);
  const { R, U, T } = F;
  [[R, T], [T, U]].forEach(([a, b]) => ticks(s, a, b, C.x).show(0));
  const wR = ang(s, R, 85, 0, 50, C.x, { show: true }), wU = ang(s, U, 85, 130, 180, C.x, { show: true });
  const lR = lab(s, deg(50, C.x), R, 25, 140, 48, { show: true }), lU = lab(s, deg(50, C.x), U, 155, 140, 48, { show: true });
  F.xArc.show(0);
  const SX = 1080, BX = 1150;
  const t0 = s.c(0);
  s.text("Where did 100 come from?", SX, 300, 56, { ax: 0, weight: 700 }).fadeIn(t0);
  // "fifty plus fifty": each 50 flies off its corner into the sum
  const t1 = s.c(1);
  wR.pulse(t1 + 0.4, 1.3); wU.pulse(t1 + 0.8, 1.3);
  const q = mrow(s, [col("50", C.x), "+", col("50", C.x), "=", `<b style="color:${C.neg}">100</b>`], BX, 400, 58);
  fly(s, lR, q[0], t1 + 1.8, 0.8); q[1].fadeIn(t1 + 2.9, 0.3, 0); fly(s, lU, q[2], t1 + 2.7, 0.7);
  q[3].fadeIn(t1 + 3.6, 0.3, 0); q[4].pop(t1 + 3.7);
  s.text(`the two base angles, not ${m("x")}`, BX, 475, 44, { ax: 0, color: C.dim }).fadeIn(t1 + 4.2);

  const t2 = s.c(2);
  s.badge("✓", "Check: exterior angle shortcut", SX, 600).fadeIn(t2);
  const wT = ang(s, T, 80, 230, 310, C.op, { show: true, fo: 0.3 });
  wT.pulse(t2 + 4.9, 1.3); wR.pulse(t2 + 5.2, 1.3);
  const cR = ang(s, R, 85, 0, 50, C.x, { fo: 0.7 }), cT = ang(s, T, 80, 230, 310, C.op, { fo: 0.7 });
  cR.show(t2 + 5.7); cT.show(t2 + 5.7);
  cR.tw(t2 + 5.8, 1.3, { x: U.x, y: U.y }, "inout");
  cT.tw(t2 + 6.0, 1.5, { x: U.x, y: U.y, rot: 180 }, "inout");
  // "Eighty plus fifty is one thirty": the numbers come off the figure, and the result goes back onto it.
  const k = mrow(s, [m("x"), "=", deg(80, C.op), "+", deg(50, C.x), "=", "130", col("✓", C.op)], BX, 690, 58, { weight: 600 });
  k[0].fadeIn(t2 + 1.8, 0.4, 0); k[1].fadeIn(t2 + 1.9, 0.4, 0);
  fly(s, F.l80, k[2], t2 + 6.5, 0.7); k[3].fadeIn(t2 + 7.4, 0.3, 0); fly(s, lR, k[4], t2 + 7.2, 0.7);
  k[5].fadeIn(t2 + 8.3, 0.3, 0); k[6].fadeIn(t2 + 8.4, 0.4, 0);
  const xVal = lab(s, `${XD} = 130°`, U, 65, 175, 52);
  fly(s, k[6], xVal, t2 + 8.9, 0.8, "130"); F.xLab.fadeOut(t2 + 9.4, 0.3);
  k[7].pop(t2 + 9.6);

  s.text("Write every angle you find on the figure.", CX, 965, 56, { color: C.x, weight: 700 }).pop(s.c(3));
});

scene("S11Recap", s => {
  s.text("Your angle facts", CX, 175, 72, { weight: 700 }).fadeIn(s.c(0));
  const lines = [
    "Straight line = 180°.   Around a point = 360°.",
    "Vertical angles are equal.",
    "Triangle = 180°.   Exterior angle = the 2 far inside angles.",
    "Parallel lines: only 2 sizes.   n sides: (n − 2) × 180°.",
    "Write every angle on the figure until you reach x.",
  ];
  lines.forEach((l, i) => s.badge(i + 1, `<span style="color:#fff;font-weight:500">${m(l)}</span>`, 220, 300 + i * 118, { size: 46 })
    .fadeIn(s.c(i + 1), 0.6, 0).set(s.c(i + 1), { sx: -30 }).tw(s.c(i + 1), 0.6, { sx: 0 }));
  s.text("Next: Workbook Unit 6 practice.  You've got this!", CX, 920, 54, { color: C.op, weight: 700 }).pop(s.c(6));
});

}
